version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      npm-compatible-updates:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "eslint"
          - "sharp"
        update-types:
          - "minor"
          - "patch"
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /src/api
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      pip-compatible-updates:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "django-unfold"
        update-types:
          - "minor"
          - "patch"
      pip-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /src/api
      - /src/web
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      docker-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      docker-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      github-actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/prod
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      terraform-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      terraform-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
