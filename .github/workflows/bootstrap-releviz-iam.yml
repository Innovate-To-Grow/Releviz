name: Bootstrap Releviz IAM Migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE to create the Releviz production deployment role
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: bootstrap-releviz-iam
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap Releviz production IAM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: Production

    env:
      AWS_REGION: us-west-2
      LEGACY_DEPLOY_ROLE_ARN: ${{ vars.AWS_PROD_ROLE_ARN }}
      BRIDGE_ROLE_NAME: scheduler-prod-releviz-bootstrap
      STATE_BUCKET: releviz-prod-tfstate-394167325273
      LOCK_TABLE: releviz-prod-terraform-locks
      NEW_DEPLOY_ROLE_NAME: releviz-production-github-deploy
      OIDC_PROVIDER_ARN: arn:aws:iam::394167325273:oidc-provider/token.actions.githubusercontent.com
      ROUTE53_ZONE_ID: Z08747271NZMYXQMSFLPX
      DJANGO_SECRET_KEY_ARN: arn:aws:secretsmanager:us-west-2:394167325273:secret:releviz/prod/django-secret-key-F9asgD
      FIELD_ENCRYPTION_KEY_ARN: arn:aws:secretsmanager:us-west-2:394167325273:secret:releviz/prod/django-field-encryption-key-8k5Xj6
      METRICS_BEARER_TOKEN_ARN: arn:aws:secretsmanager:us-west-2:394167325273:secret:releviz/prod/metrics-bearer-token-RzUNy2

    steps:
      - name: Confirm one-time migration
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "MIGRATE" ]; then
            echo "::error::IAM migration requires the exact confirmation MIGRATE."
            exit 1
          fi
          if [ "$LEGACY_DEPLOY_ROLE_ARN" != \
            "arn:aws:iam::394167325273:role/scheduler-production-github-deploy" ]; then
            echo "::error::The Production environment no longer points at the expected legacy role."
            exit 1
          fi

      - name: Checkout migration definition
        uses: actions/checkout@v7

      - name: Configure legacy deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.LEGACY_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create restricted one-time bridge role
        id: bridge
        env:
          BRIDGE_POLICY_NAME: scheduler-prod-releviz-bootstrap
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          bridge_role_arn="arn:aws:iam::${account_id}:role/${BRIDGE_ROLE_NAME}"
          new_role_arn="arn:aws:iam::${account_id}:role/${NEW_DEPLOY_ROLE_NAME}"
          state_bucket_arn="arn:aws:s3:::${STATE_BUCKET}"

          jq -n \
            --arg provider "$OIDC_PROVIDER_ARN" \
            --arg subject "repo:${GITHUB_REPOSITORY}:environment:Production" \
            '{
              Version: "2012-10-17",
              Statement: [{
                Effect: "Allow",
                Principal: {Federated: $provider},
                Action: "sts:AssumeRoleWithWebIdentity",
                Condition: {StringEquals: {
                  "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
                  "token.actions.githubusercontent.com:sub": $subject
                }}
              }]
            }' > "$RUNNER_TEMP/bridge-trust.json"

          jq -n \
            --arg state_bucket "$state_bucket_arn" \
            --arg state_objects "${state_bucket_arn}/bootstrap/*" \
            --arg new_role "$new_role_arn" \
            '{
              Version: "2012-10-17",
              Statement: [
                {
                  Sid: "BootstrapStateBucket",
                  Effect: "Allow",
                  Action: ["s3:Get*", "s3:ListBucket"],
                  Resource: $state_bucket
                },
                {
                  Sid: "BootstrapStateObjects",
                  Effect: "Allow",
                  Action: ["s3:DeleteObject", "s3:GetObject", "s3:PutObject"],
                  Resource: $state_objects
                },
                {
                  Sid: "CreateExactRelevizDeploymentRole",
                  Effect: "Allow",
                  Action: [
                    "iam:CreateRole",
                    "iam:DeleteRole",
                    "iam:DeleteRolePolicy",
                    "iam:GetRole",
                    "iam:GetRolePolicy",
                    "iam:ListAttachedRolePolicies",
                    "iam:ListInstanceProfilesForRole",
                    "iam:ListRolePolicies",
                    "iam:PutRolePolicy",
                    "iam:TagRole",
                    "iam:UntagRole",
                    "iam:UpdateAssumeRolePolicy"
                  ],
                  Resource: $new_role
                },
                {
                  Sid: "VerifyIdentity",
                  Effect: "Allow",
                  Action: "sts:GetCallerIdentity",
                  Resource: "*"
                }
              ]
            }' > "$RUNNER_TEMP/bridge-policy.json"

          if aws iam get-role --role-name "$BRIDGE_ROLE_NAME" >/dev/null 2>&1; then
            aws iam update-assume-role-policy \
              --role-name "$BRIDGE_ROLE_NAME" \
              --policy-document "file://$RUNNER_TEMP/bridge-trust.json"
          else
            aws iam create-role \
              --role-name "$BRIDGE_ROLE_NAME" \
              --assume-role-policy-document "file://$RUNNER_TEMP/bridge-trust.json" \
              --max-session-duration 3600 \
              --tags Key=Project,Value=releviz Key=Purpose,Value=one-time-iam-migration >/dev/null
          fi

          aws iam put-role-policy \
            --role-name "$BRIDGE_ROLE_NAME" \
            --policy-name "$BRIDGE_POLICY_NAME" \
            --policy-document "file://$RUNNER_TEMP/bridge-policy.json"
          echo "role_arn=$bridge_role_arn" >> "$GITHUB_OUTPUT"

      - name: Configure restricted bridge role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.bridge.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Initialize Releviz bootstrap state
        run: |
          terraform -chdir=infra/bootstrap init -reconfigure -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=bootstrap/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: Plan exact deployment-role bootstrap
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_state_bucket_name: ${{ env.STATE_BUCKET }}
          TF_VAR_lock_table_name: ${{ env.LOCK_TABLE }}
          TF_VAR_existing_github_oidc_provider_arn: ${{ env.OIDC_PROVIDER_ARN }}
          TF_VAR_production_route53_zone_id: ${{ env.ROUTE53_ZONE_ID }}
          TF_VAR_production_secret_arns: >-
            ["${{ env.DJANGO_SECRET_KEY_ARN }}",
            "${{ env.FIELD_ENCRYPTION_KEY_ARN }}",
            "${{ env.METRICS_BEARER_TOKEN_ARN }}"]
        run: |
          terraform -chdir=infra/bootstrap plan -input=false \
            -target=aws_iam_role.production_deploy \
            -target=aws_iam_role_policy.production_deploy \
            -target=aws_iam_role_policy.production_deploy_kms \
            -out=releviz-iam-bootstrap.tfplan

      - name: Apply exact deployment-role bootstrap
        run: |
          terraform -chdir=infra/bootstrap apply -input=false -auto-approve \
            releviz-iam-bootstrap.tfplan

      - name: Verify the Releviz deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::394167325273:role/releviz-production-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Releviz deployment dependencies
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws s3api head-bucket --bucket "$STATE_BUCKET"
          aws secretsmanager describe-secret --secret-id "$DJANGO_SECRET_KEY_ARN" >/dev/null
          aws secretsmanager describe-secret --secret-id "$FIELD_ENCRYPTION_KEY_ARN" >/dev/null
          aws secretsmanager describe-secret --secret-id "$METRICS_BEARER_TOKEN_ARN" >/dev/null
          aws kms describe-key --key-id alias/aws/rds >/dev/null
          aws kms describe-key --key-id alias/aws/secretsmanager >/dev/null

      - name: Restore legacy credentials for cleanup
        if: ${{ always() }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.LEGACY_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete one-time bridge role
        if: ${{ always() }}
        env:
          BRIDGE_POLICY_NAME: scheduler-prod-releviz-bootstrap
        run: |
          set -euo pipefail
          if aws iam get-role --role-name "$BRIDGE_ROLE_NAME" >/dev/null 2>&1; then
            aws iam delete-role-policy \
              --role-name "$BRIDGE_ROLE_NAME" \
              --policy-name "$BRIDGE_POLICY_NAME"
            aws iam delete-role --role-name "$BRIDGE_ROLE_NAME"
          fi
