name: Releviz Infrastructure Release
run-name: "Infrastructure release (manual): ${{ github.sha }}"

on:
  # Called by the production release workflow (release.yml), which decides
  # from a credential-free scope whether infra/prod changed and runs every
  # affected surface side by side so the reviewer approves the whole release
  # once. The release job waits in the "AWS ECS - Prod" environment for that
  # approval before AWS credentials are issued. Manual dispatch of this file
  # alone stays available for reconciling drift.
  workflow_call:
    inputs:
      deploy-sha:
        description: The immutable main commit to release
        required: true
        type: string
      trigger-event:
        description: github.event_name of the calling run (workflow_run or workflow_dispatch)
        required: true
        type: string
      confirmation:
        description: The DEPLOY confirmation of a manually dispatched calling run
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to release the selected main commit to production
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  deployments: write
  id-token: write

jobs:
  release:
    name: Release infrastructure to production
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A lone dispatch and an orchestrated release of the infrastructure never
    # overlap; a concurrent backend apply serializes on the remote state lock.
    concurrency:
      group: release-infrastructure
      cancel-in-progress: false
    environment:
      name: AWS ECS - Prod
      url: https://${{ vars.PROD_DOMAIN }}

    env:
      TRIGGER_EVENT: ${{ inputs.trigger-event || github.event_name }}
      CONFIRMATION: ${{ inputs.confirmation }}
      # Called: the release commit release.yml scoped; dispatch: the selected main commit.
      DEPLOY_SHA: ${{ inputs.deploy-sha || github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      AWS_ROLE_ARN: ${{ vars.AWS_PROD_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.PROD_TF_STATE_BUCKET }}
      ECR_BACKEND: ${{ vars.ECR_PROD_BACKEND || 'releviz-prod-backend' }}
      ECR_FRONTEND: ${{ vars.ECR_PROD_FRONTEND || 'releviz-prod-frontend' }}
      PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
      API_DOMAIN: ${{ vars.PROD_API_DOMAIN || 'api.releviz.com' }}
      ROUTE53_ZONE_ID: ${{ vars.PROD_ROUTE53_ZONE_ID }}
      DJANGO_SECRET_KEY_ARN: ${{ vars.PROD_DJANGO_SECRET_KEY_ARN }}
      FIELD_ENCRYPTION_KEY_ARN: ${{ vars.PROD_DJANGO_FIELD_ENCRYPTION_KEY_ARN }}
      METRICS_BEARER_TOKEN_ARN: ${{ vars.PROD_METRICS_BEARER_TOKEN_ARN }}
      DEFAULT_ADMIN_EMAIL: ${{ vars.PROD_DEFAULT_ADMIN_EMAIL || 'admin@releviz.com' }}
      DEFAULT_ADMIN_PASSWORD_SECRET_ARN: ${{ vars.PROD_DEFAULT_ADMIN_PASSWORD_SECRET_ARN }}
      SENTRY_DSN_SECRET_ARN: ${{ vars.PROD_SENTRY_DSN_SECRET_ARN || '' }}
      AMPLIFY_APP_ID: ${{ vars.PROD_AMPLIFY_APP_ID }}
      ALARM_ACTION_ARNS: ${{ vars.PROD_ALARM_ACTION_ARNS_JSON }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-west-2' }}
      TF_VAR_ecr_backend_repository: ${{ vars.ECR_PROD_BACKEND || 'releviz-prod-backend' }}
      TF_VAR_ecr_frontend_repository: ${{ vars.ECR_PROD_FRONTEND || 'releviz-prod-frontend' }}
      TF_VAR_custom_domain: ${{ vars.PROD_DOMAIN }}
      TF_VAR_api_domain: ${{ vars.PROD_API_DOMAIN || 'api.releviz.com' }}
      TF_VAR_enable_amplify_domain: "true"
      TF_VAR_enable_legacy_api_compatibility: "false"
      TF_VAR_route53_zone_id: ${{ vars.PROD_ROUTE53_ZONE_ID }}
      TF_VAR_django_secret_key_arn: ${{ vars.PROD_DJANGO_SECRET_KEY_ARN }}
      TF_VAR_django_field_encryption_key_arn: ${{ vars.PROD_DJANGO_FIELD_ENCRYPTION_KEY_ARN }}
      TF_VAR_metrics_bearer_token_arn: ${{ vars.PROD_METRICS_BEARER_TOKEN_ARN }}
      TF_VAR_default_admin_email: ${{ vars.PROD_DEFAULT_ADMIN_EMAIL || 'admin@releviz.com' }}
      TF_VAR_default_admin_password_secret_arn: ${{ vars.PROD_DEFAULT_ADMIN_PASSWORD_SECRET_ARN }}
      TF_VAR_sentry_dsn_secret_arn: ${{ vars.PROD_SENTRY_DSN_SECRET_ARN || '' }}
      TF_VAR_secret_kms_key_arn: ${{ vars.PROD_SECRET_KMS_KEY_ARN || '' }}
      TF_VAR_existing_acm_certificate_arn: ${{ vars.PROD_ACM_CERTIFICATE_ARN || '' }}
      TF_VAR_alarm_action_arns: ${{ vars.PROD_ALARM_ACTION_ARNS_JSON }}
      TF_VAR_default_from_email: ${{ vars.PROD_DEFAULT_FROM_EMAIL || 'noreply@releviz.com' }}
      TF_VAR_amplify_app_id: ${{ vars.PROD_AMPLIFY_APP_ID }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Release preflight
        uses: ./.github/actions/release-preflight
        with:
          scope: infrastructure

      - name: Install reviewed Amplify security headers
        run: |
          set -euo pipefail
          custom_headers="$(jq -c . infra/prod/amplify-custom-headers.json)"
          aws amplify update-app \
            --app-id "$AMPLIFY_APP_ID" \
            --custom-headers "$custom_headers" >/dev/null
          live_headers="$(
            aws amplify get-app \
              --app-id "$AMPLIFY_APP_ID" \
              --query app.customHeaders \
              --output text
          )"
          if ! grep -Fq "https://${API_DOMAIN}" <<<"$live_headers"; then
            echo "::error::Amplify did not retain the reviewed API connect-src policy."
            exit 1
          fi

      - name: Resolve the application images for this plan
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Infrastructure releases keep the application on its latest
          # successfully released images (falling back to the deployed ones);
          # they never introduce an application build of their own. A surface
          # released in this same run is still in flight and is picked up by
          # the next infrastructure release.
          resolve() {
            local surface="$1" repository="$2" output="$3" released tag image_uri definition
            released="$(scripts/ci/last-successful-release.sh "$surface")"
            tag=""
            if [[ "$released" =~ ^[0-9a-f]{40}$ ]] &&
              aws ecr describe-images --repository-name "$repository" \
                --image-ids "imageTag=${released}" >/dev/null 2>&1; then
              tag="$released"
            else
              definition="$(terraform -chdir=infra/prod output -raw "$output" 2>/dev/null || true)"
              if [ -n "$definition" ]; then
                image_uri="$(
                  aws ecs describe-task-definition \
                    --task-definition "$definition" \
                    --query "taskDefinition.containerDefinitions[0].image" \
                    --output text
                )"
                tag="${image_uri##*:}"
              fi
            fi
            if ! [[ "$tag" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::No immutable ${repository} image is available for the plan." >&2
              return 1
            fi
            printf '%s\n' "$tag"
          }
          backend="$(resolve backend "$ECR_BACKEND" backend_task_definition_arn)"
          frontend="$(resolve frontend "$ECR_FRONTEND" frontend_task_definition_arn)"
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
          } >>"$GITHUB_OUTPUT"
          echo "::notice::Planning with backend ${backend} and ECS fallback frontend ${frontend}."

      - name: Plan the infrastructure release
        env:
          TF_VAR_backend_image_tag: ${{ steps.images.outputs.backend }}
          TF_VAR_frontend_image_tag: ${{ steps.images.outputs.frontend }}
        run: |
          terraform -chdir=infra/prod plan -input=false -lock-timeout=15m \
            -out=infrastructure-release.tfplan

      - name: Guard the infrastructure release plan
        id: plan_guard
        run: |
          set -euo pipefail
          plan_json="${RUNNER_TEMP}/infrastructure-release.json"
          terraform -chdir=infra/prod show -json infrastructure-release.tfplan >"$plan_json"
          # Nothing may be destroyed outright, the live Amplify branches and
          # domain stay untouched, and the Amplify app may only change its
          # redirect rules (custom headers are installed separately).
          unexpected="$(
            jq -c '
              [
                .resource_changes[]?
                | select(.change.actions != ["no-op"])
                | select(
                    .change.actions == ["delete"]
                    or (.address | startswith("aws_amplify_branch."))
                    or (.address | startswith("aws_amplify_domain_association."))
                    or (
                      .address == "aws_amplify_app.frontend"
                      and (
                        .change.actions != ["update"]
                        or (
                          (.change.before | del(.custom_rule))
                          != (.change.after | del(.custom_rule))
                        )
                      )
                    )
                  )
                | {address, actions: .change.actions}
              ]
            ' "$plan_json"
          )"
          if [ "$unexpected" != "[]" ]; then
            echo "::error::The infrastructure release plan contains changes the automated release refuses: ${unexpected}"
            echo "::error::Destroying resources or changing the live Amplify branches or domain requires an administrator-run, reviewed apply."
            exit 1
          fi
          ecs_changes="$(
            jq -r '
              [
                .resource_changes[]?
                | select(.change.actions != ["no-op"])
                | select(.address | test("^aws_ecs_(service|task_definition)\\."))
              ] | length
            ' "$plan_json"
          )"
          echo "ecs_changes=${ecs_changes}" >>"$GITHUB_OUTPUT"
          {
            echo "## Infrastructure plan"
            echo
            jq -r '
              .resource_changes[]?
              | select(.change.actions != ["no-op"])
              | "- `\(.address)`: \(.change.actions | join(", "))"
            ' "$plan_json"
            echo
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Apply the exact infrastructure release plan
        run: terraform -chdir=infra/prod apply -input=false -auto-approve infrastructure-release.tfplan

      - name: Capture deployed AWS resources
        id: terraform
        run: |
          {
            echo "cluster_name=$(terraform -chdir=infra/prod output -raw ecs_cluster_name)"
            echo "backend_service=$(terraform -chdir=infra/prod output -raw backend_service_name)"
            echo "result_worker_service=$(terraform -chdir=infra/prod output -raw result_worker_service_name)"
            echo "email_worker_service=$(terraform -chdir=infra/prod output -raw email_worker_service_name)"
            echo "frontend_service=$(terraform -chdir=infra/prod output -raw frontend_service_name)"
            echo "event_reminders_rule=$(terraform -chdir=infra/prod output -raw event_reminders_rule_name)"
            echo "api_domain=$(terraform -chdir=infra/prod output -raw api_domain)"
          } >>"$GITHUB_OUTPUT"

      - name: Wait for ECS services to stabilize on the applied release
        run: |
          aws ecs wait services-stable \
            --cluster "${{ steps.terraform.outputs.cluster_name }}" \
            --services \
              "${{ steps.terraform.outputs.backend_service }}" \
              "${{ steps.terraform.outputs.result_worker_service }}" \
              "${{ steps.terraform.outputs.email_worker_service }}" \
              "${{ steps.terraform.outputs.frontend_service }}"

      - name: Verify ECS services use Terraform-selected task definitions
        run: |
          set -euo pipefail
          for role in backend result_worker email_worker frontend; do
            case "$role" in
              backend) service="${{ steps.terraform.outputs.backend_service }}" ;;
              result_worker) service="${{ steps.terraform.outputs.result_worker_service }}" ;;
              email_worker) service="${{ steps.terraform.outputs.email_worker_service }}" ;;
              frontend) service="${{ steps.terraform.outputs.frontend_service }}" ;;
            esac
            expected="$(
              terraform -chdir=infra/prod output -raw "${role}_task_definition_arn"
            )"
            service_state="$(
              aws ecs describe-services \
                --cluster "${{ steps.terraform.outputs.cluster_name }}" \
                --services "$service" \
                --output json
            )"
            if ! jq -e --arg expected "$expected" '
              (.failures | length) == 0
              and (.services | length) == 1
              and .services[0].taskDefinition == $expected
              and (
                [.services[0].deployments[] | select(.status == "PRIMARY")]
                | length
              ) == 1
            ' <<<"$service_state" >/dev/null; then
              echo "::error::The ${role} service stabilized on a task definition other than the reviewed Terraform release."
              exit 1
            fi
          done
          event_targets="$(
            aws events list-targets-by-rule \
              --rule "${{ steps.terraform.outputs.event_reminders_rule }}" \
              --output json
          )"
          expected_backend="$(terraform -chdir=infra/prod output -raw backend_task_definition_arn)"
          if ! jq -e \
            --arg expected "$expected_backend" \
            '(.Targets | length) == 1
              and .Targets[0].EcsParameters.TaskDefinitionArn == $expected' \
              <<<"$event_targets" >/dev/null; then
            echo "::error::The reminder rule must have exactly one target pinned to the released backend task definition."
            exit 1
          fi

      - name: Verify ALB target health
        run: |
          set -euo pipefail
          for service in \
            "${{ steps.terraform.outputs.backend_service }}" \
            "${{ steps.terraform.outputs.frontend_service }}"; do
            target_group="$(
              aws ecs describe-services \
                --cluster "${{ steps.terraform.outputs.cluster_name }}" \
                --services "$service" \
                --query "services[0].loadBalancers[0].targetGroupArn" \
                --output text
            )"
            healthy=false
            for attempt in $(seq 1 30); do
              health="$(aws elbv2 describe-target-health --target-group-arn "$target_group")"
              if jq -e '
                [.TargetHealthDescriptions[].TargetHealth.State] as $states
                | ($states | length) > 0
                and all($states[]; . == "healthy")
              ' <<<"$health" >/dev/null; then
                healthy=true
                break
              fi
              echo "Target health for ${service} is converging; attempt=${attempt}/30"
              sleep 10
            done
            if [ "$healthy" != "true" ]; then
              echo "::error::ALB targets for ${service} did not become healthy."
              exit 1
            fi
          done

      - name: Run production smoke tests
        env:
          DEPLOYED_API_DOMAIN: ${{ steps.terraform.outputs.api_domain }}
        run: |
          set -euo pipefail
          for path in /health/live /health /admin/; do
            curl \
              --connect-timeout 5 \
              --fail \
              --location \
              --max-time 20 \
              --show-error \
              --retry 20 \
              --retry-all-errors \
              --retry-delay 5 \
              "https://${DEPLOYED_API_DOMAIN}${path}" >/dev/null
          done
          canonical_security_headers="${RUNNER_TEMP}/canonical-security.headers"
          curl \
            --connect-timeout 5 \
            --fail \
            --max-time 20 \
            --silent \
            --show-error \
            --retry 20 \
            --retry-all-errors \
            --retry-delay 5 \
            --dump-header "$canonical_security_headers" \
            --output /dev/null \
            "https://${PROD_DOMAIN}/"
          if ! grep -Fqi "strict-transport-security: max-age=31536000; includeSubDomains" \
            "$canonical_security_headers" ||
            ! grep -Fqi "x-content-type-options: nosniff" "$canonical_security_headers" ||
            ! grep -Fqi "x-frame-options: DENY" "$canonical_security_headers" ||
            ! grep -Fqi "referrer-policy: no-referrer" "$canonical_security_headers" ||
            ! grep -i '^content-security-policy:' "$canonical_security_headers" |
              grep -Fq "connect-src 'self' https://${API_DOMAIN}"; then
            echo "::error::Canonical Amplify responses do not contain the reviewed security-header policy."
            exit 1
          fi
          while IFS= read -r route; do
            for path in "/${route}" "/${route}/"; do
              curl \
                --connect-timeout 5 \
                --fail \
                --location \
                --max-time 20 \
                --show-error \
                --retry 20 \
                --retry-all-errors \
                --retry-delay 5 \
                "https://${PROD_DOMAIN}${path}" >/dev/null
            done
          done < <(jq -r '.static_routes[]' src/web/amplify-routes.json)
          # The applied plan carries the app-level not-found rule; unknown
          # paths must serve the exported 404 document with a 404 status.
          missing_page_body="${RUNNER_TEMP}/canonical-missing-page.html"
          missing_page_status=""
          for attempt in $(seq 1 30); do
            : >"$missing_page_body"
            missing_page_status="$(
              curl \
                --connect-timeout 5 \
                --header "Cache-Control: no-cache" \
                --header "Pragma: no-cache" \
                --max-time 20 \
                --silent \
                --show-error \
                --output "$missing_page_body" \
                --write-out "%{http_code}" \
                "https://${PROD_DOMAIN}/releviz-smoke-missing-${DEPLOY_SHA}/?missing_check=${attempt}" ||
                true
            )"
            if [ "$missing_page_status" = "404" ] &&
              grep -Fq "Page not found" "$missing_page_body"; then
              break
            fi
            echo "Unknown-path routing is still converging; status=${missing_page_status:-request-failed}, attempt=${attempt}/30"
            sleep 5
          done
          if [ "$missing_page_status" != "404" ] ||
            ! grep -Fq "Page not found" "$missing_page_body"; then
            echo "::error::Canonical unknown path did not serve the app 404 page with a 404 status."
            exit 1
          fi
          preflight_headers="${RUNNER_TEMP}/canonical-api-preflight.headers"
          preflight_status="$(
            curl \
              --connect-timeout 5 \
              --max-time 20 \
              --silent \
              --show-error \
              --request OPTIONS \
              --header "Origin: https://${PROD_DOMAIN}" \
              --header "Access-Control-Request-Method: PUT" \
              --header "Access-Control-Request-Headers: authorization,content-type" \
              --dump-header "$preflight_headers" \
              --output /dev/null \
              --write-out "%{http_code}" \
              "https://${DEPLOYED_API_DOMAIN}/authn/profile/"
          )"
          if [ "$preflight_status" != "200" ] ||
            ! grep -Fqi "access-control-allow-origin: https://${PROD_DOMAIN}" "$preflight_headers" ||
            ! grep -qiE '^access-control-allow-credentials:[[:space:]]*true' "$preflight_headers"; then
            echo "::error::The API did not accept the canonical frontend credentialed CORS preflight."
            exit 1
          fi

      - name: Summarize the infrastructure release
        if: ${{ always() }}
        env:
          BACKEND_SHA: ${{ steps.images.outputs.backend }}
          FRONTEND_SHA: ${{ steps.images.outputs.frontend }}
          ECS_CHANGES: ${{ steps.plan_guard.outputs.ecs_changes }}
        run: |
          {
            echo "## Infrastructure release"
            echo
            echo "- Release commit: \`${DEPLOY_SHA}\`"
            echo "- Backend image held at: \`${BACKEND_SHA:-unresolved}\`"
            echo "- ECS fallback frontend held at: \`${FRONTEND_SHA:-unresolved}\`"
            echo "- ECS resources changed by the plan: ${ECS_CHANGES:-unknown}"
          } >>"$GITHUB_STEP_SUMMARY"
