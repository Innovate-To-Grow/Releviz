name: CI Retry
run-name: >-
  CI retry: ${{ github.event.workflow_run.display_title }}

on:
  # When the first attempt of a CI run fails because of the infrastructure
  # (a registry rate limit, an unreachable package index, a lost runner; see
  # scripts/ci/retry_transient_failures.py), its failed jobs are rerun once.
  # The second attempt's result stands either way, and a failure the code
  # caused is never retried. On main, a green rerun triggers the production
  # release like any other green CI run, so a run that a newer one on the
  # same branch has superseded is left alone.
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  retry:
    name: Retry transient CI failures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Dependabot's runs hand this workflow a read-only token, which cannot
    # rerun anything.
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.run_attempt == 1 &&
        github.event.workflow_run.actor.login != 'dependabot[bot]'
      }}
    steps:
      # A workflow_run workflow checks out the default branch, not the CI
      # run's commit, so a pull request cannot change the script it runs.
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Rerun failed jobs when the infrastructure failed them
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/ci/retry_transient_failures.py
