name: Deploy Staging

on:
 workflow_dispatch:
 workflow_run:
   workflows: ["CI"]
   types: [completed]

permissions:
 id-token: write
 contents: read
 actions: read

concurrency:
 group: deploy-staging
 cancel-in-progress: false

jobs:
 deploy:
   name: Deploy to Staging
   runs-on: ubuntu-latest
   if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}

   env:
     AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
     AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
     ECR_BACKEND: ${{ vars.ECR_STAGING_BACKEND || 'scheduler-staging-backend' }}
     ECR_FRONTEND: ${{ vars.ECR_STAGING_FRONTEND || 'scheduler-staging-frontend' }}
     DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

   steps:
     - name: Checkout code at tested commit
       uses: actions/checkout@v4
       with:
         ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

     - name: Configure AWS credentials (OIDC)
       if: ${{ vars.AWS_ROLE_ARN != '' }}
       uses: aws-actions/configure-aws-credentials@v4
       with:
         role-to-assume: ${{ env.AWS_ROLE_ARN }}
         aws-region: ${{ env.AWS_REGION }}

     - name: Configure AWS credentials (static secrets)
       if: ${{ vars.AWS_ROLE_ARN == '' }}
       uses: aws-actions/configure-aws-credentials@v4
       with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
         aws-region: ${{ env.AWS_REGION }}

     - name: Prepare Terraform backend
       id: backend
       run: |
         set +e
         ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
         STATE_BUCKET="scheduler-staging-tfstate-${ACCOUNT_ID}"
         LOCK_TABLE="scheduler-staging-terraform-locks"
         BACKEND_MODE="remote"

         if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
           if [ "${AWS_REGION}" = "us-east-1" ]; then
             aws s3api create-bucket --bucket "$STATE_BUCKET" --region "${AWS_REGION}" || BACKEND_MODE="local"
           else
             aws s3api create-bucket --bucket "$STATE_BUCKET" --region "${AWS_REGION}" \
               --create-bucket-configuration LocationConstraint="${AWS_REGION}" || BACKEND_MODE="local"
           fi
         fi

         if [ "$BACKEND_MODE" = "remote" ]; then
           aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" \
             --versioning-configuration Status=Enabled || BACKEND_MODE="local"
           aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" \
             --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}' || BACKEND_MODE="local"
           aws s3api put-public-access-block --bucket "$STATE_BUCKET" \
             --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true || BACKEND_MODE="local"
         fi

         if [ "$BACKEND_MODE" = "remote" ]; then
           if ! aws dynamodb describe-table --table-name "$LOCK_TABLE" >/dev/null 2>&1; then
             aws dynamodb create-table \
               --table-name "$LOCK_TABLE" \
               --attribute-definitions AttributeName=LockID,AttributeType=S \
               --key-schema AttributeName=LockID,KeyType=HASH \
               --billing-mode PAY_PER_REQUEST || BACKEND_MODE="local"
             if [ "$BACKEND_MODE" = "remote" ]; then
               aws dynamodb wait table-exists --table-name "$LOCK_TABLE" || BACKEND_MODE="local"
             fi
           fi
         fi

         echo "backend_mode=$BACKEND_MODE" >> "$GITHUB_OUTPUT"
         echo "state_bucket=$STATE_BUCKET" >> "$GITHUB_OUTPUT"
         echo "lock_table=$LOCK_TABLE" >> "$GITHUB_OUTPUT"
         set -e

     - name: Set up Terraform
       uses: hashicorp/setup-terraform@v3

     - name: Terraform init (remote backend)
       if: ${{ steps.backend.outputs.backend_mode == 'remote' }}
       run: |
         terraform -chdir=infra/staging init -reconfigure -input=false \
           -backend-config="bucket=${{ steps.backend.outputs.state_bucket }}" \
           -backend-config="dynamodb_table=${{ steps.backend.outputs.lock_table }}" \
           -backend-config="key=staging/terraform.tfstate" \
           -backend-config="region=${AWS_REGION}"

     - name: Terraform init (local backend fallback)
       if: ${{ steps.backend.outputs.backend_mode == 'local' }}
       run: |
         perl -0777 -i -pe 's/\n\s*backend \"s3\" \{\}\n/\n/s' infra/staging/versions.tf
         terraform -chdir=infra/staging init -reconfigure -input=false

     - name: Ensure ECR repositories exist
       run: |
         for repo in "$ECR_BACKEND" "$ECR_FRONTEND"; do
           if ! aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1; then
             aws ecr create-repository \
               --repository-name "$repo" \
               --image-scanning-configuration scanOnPush=true
           fi
         done

     - name: Login to ECR
       uses: aws-actions/amazon-ecr-login@v2

     - name: Build and push backend image
       run: |
         ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
         IMAGE_URI="$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_BACKEND}"
         docker build -t "$IMAGE_URI:${DEPLOY_SHA}" -t "$IMAGE_URI:staging-latest" ./backend
         docker push "$IMAGE_URI:${DEPLOY_SHA}"
         docker push "$IMAGE_URI:staging-latest"

     - name: Build and push frontend image
       run: |
         cp package-lock.json frontend/
         ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
         IMAGE_URI="$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_FRONTEND}"
         docker build \
           --build-arg NEXT_PUBLIC_API_BASE_URL="" \
           -t "$IMAGE_URI:${DEPLOY_SHA}" -t "$IMAGE_URI:staging-latest" ./frontend
         docker push "$IMAGE_URI:${DEPLOY_SHA}"
         docker push "$IMAGE_URI:staging-latest"

     - name: Terraform apply
       id: tf
       continue-on-error: true
       run: |
         terraform -chdir=infra/staging apply -auto-approve -input=false \
           -var="aws_region=${AWS_REGION}" \
           -var="domain_name=releviz.com" \
           -var="backend_image_tag=${DEPLOY_SHA}" \
           -var="frontend_image_tag=${DEPLOY_SHA}" \
           -var="ecr_backend_repository=${ECR_BACKEND}" \
           -var="ecr_frontend_repository=${ECR_FRONTEND}" \
           -var="db_password=${{ secrets.STAGING_DB_PASSWORD }}" \
           -var="django_secret_key=${{ secrets.STAGING_DJANGO_SECRET_KEY }}" \
           -var="django_field_encryption_key=${{ secrets.STAGING_DJANGO_FIELD_ENCRYPTION_KEY }}" \
           -var="django_superuser_email=${{ vars.STAGING_DJANGO_SUPERUSER_EMAIL || '' }}" \
           -var="django_superuser_password=${{ secrets.STAGING_DJANGO_SUPERUSER_PASSWORD }}" \
           -var="django_create_default_admin=${{ vars.STAGING_CREATE_DEFAULT_ADMIN || 'false' }}"

         echo "alb_dns=$(terraform -chdir=infra/staging output -raw alb_dns_name)" >> "$GITHUB_OUTPUT"
         echo "cluster_name=$(terraform -chdir=infra/staging output -raw ecs_cluster_name)" >> "$GITHUB_OUTPUT"
         echo "backend_service=$(terraform -chdir=infra/staging output -raw backend_service_name)" >> "$GITHUB_OUTPUT"
         echo "frontend_service=$(terraform -chdir=infra/staging output -raw frontend_service_name)" >> "$GITHUB_OUTPUT"

     - name: Fallback backend ECS image refresh
       if: ${{ steps.tf.outcome == 'failure' }}
       run: |
         set -euo pipefail
         ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
         CLUSTER_NAME="scheduler-staging-cluster"
         BACKEND_SERVICE="scheduler-staging-backend-service"
         BACKEND_FAMILY="scheduler-staging-backend-task"
         BACKEND_CONTAINER="scheduler-staging-backend"
         BACKEND_IMAGE="$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_BACKEND}:${DEPLOY_SHA}"

         CURRENT_BACKEND_IMAGE=$(aws ecs describe-task-definition \
           --task-definition "$BACKEND_FAMILY" \
           --query "taskDefinition.containerDefinitions[?name=='${BACKEND_CONTAINER}'].image | [0]" \
           --output text)

         if [ -z "$CURRENT_BACKEND_IMAGE" ] || [ "$CURRENT_BACKEND_IMAGE" = "None" ]; then
           echo "Could not resolve current backend image for $BACKEND_CONTAINER" >&2
           exit 1
         fi

         docker pull "$BACKEND_IMAGE"
         docker tag "$BACKEND_IMAGE" "$CURRENT_BACKEND_IMAGE"
         docker push "$CURRENT_BACKEND_IMAGE"

         aws ecs update-service \
           --cluster "$CLUSTER_NAME" \
           --service "$BACKEND_SERVICE" \
           --force-new-deployment >/dev/null

     - name: Wait for ECS stability
       if: ${{ steps.tf.outcome == 'success' }}
       run: |
         aws ecs wait services-stable \
           --cluster "${{ steps.tf.outputs.cluster_name }}" \
           --services "${{ steps.tf.outputs.backend_service }}" "${{ steps.tf.outputs.frontend_service }}"

     - name: Wait for backend ECS stability after fallback
       if: ${{ steps.tf.outcome == 'failure' }}
       run: |
         aws ecs wait services-stable \
           --cluster "scheduler-staging-cluster" \
           --services "scheduler-staging-backend-service"

     - name: Smoke tests
       run: |
         curl --fail --show-error --retry 10 --retry-delay 5 "https://releviz.com/api/health"
         curl --fail --show-error --retry 10 --retry-delay 5 "https://releviz.com/"
