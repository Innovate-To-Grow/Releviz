name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to release the selected main commit to production
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  deployments: write
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 160
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: Production
      url: https://${{ vars.PROD_DOMAIN }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      AWS_ROLE_ARN: ${{ vars.AWS_PROD_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.PROD_TF_STATE_BUCKET }}
      ECR_BACKEND: ${{ vars.ECR_PROD_BACKEND || 'releviz-prod-backend' }}
      ECR_FRONTEND: ${{ vars.ECR_PROD_FRONTEND || 'releviz-prod-frontend' }}
      PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
      API_DOMAIN: ${{ vars.PROD_API_DOMAIN || 'api.releviz.com' }}
      LEGACY_ORIGIN_DOMAIN: ${{ vars.PROD_LEGACY_ORIGIN_DOMAIN || 'origin.releviz.com' }}
      DEFAULT_ADMIN_EMAIL: ${{ vars.PROD_DEFAULT_ADMIN_EMAIL || 'admin@releviz.com' }}
      DEPLOY_SHA: ${{ github.sha }}
      PRODUCTION_JOB_TIMEOUT_SECONDS: "9600"
      AMPLIFY_TIMEOUT_SECONDS: "1200"
      AMPLIFY_ARTIFACT: ${{ github.workspace }}/releviz-amplify-${{ github.sha }}.zip
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-west-2' }}
      TF_VAR_backend_image_tag: ${{ github.sha }}
      TF_VAR_frontend_image_tag: ${{ github.sha }}
      TF_VAR_ecr_backend_repository: ${{ vars.ECR_PROD_BACKEND || 'releviz-prod-backend' }}
      TF_VAR_ecr_frontend_repository: ${{ vars.ECR_PROD_FRONTEND || 'releviz-prod-frontend' }}
      TF_VAR_custom_domain: ${{ vars.PROD_DOMAIN }}
      TF_VAR_api_domain: ${{ vars.PROD_API_DOMAIN || 'api.releviz.com' }}
      TF_VAR_legacy_origin_domain: ${{ vars.PROD_LEGACY_ORIGIN_DOMAIN || 'origin.releviz.com' }}
      TF_VAR_enable_legacy_api_compatibility: "false"
      TF_VAR_route53_zone_id: ${{ vars.PROD_ROUTE53_ZONE_ID }}
      TF_VAR_django_secret_key_arn: ${{ vars.PROD_DJANGO_SECRET_KEY_ARN }}
      TF_VAR_django_field_encryption_key_arn: ${{ vars.PROD_DJANGO_FIELD_ENCRYPTION_KEY_ARN }}
      TF_VAR_metrics_bearer_token_arn: ${{ vars.PROD_METRICS_BEARER_TOKEN_ARN }}
      TF_VAR_default_admin_email: ${{ vars.PROD_DEFAULT_ADMIN_EMAIL || 'admin@releviz.com' }}
      TF_VAR_default_admin_password_secret_arn: ${{ vars.PROD_DEFAULT_ADMIN_PASSWORD_SECRET_ARN }}
      TF_VAR_sentry_dsn_secret_arn: ${{ vars.PROD_SENTRY_DSN_SECRET_ARN || '' }}
      TF_VAR_secret_kms_key_arn: ${{ vars.PROD_SECRET_KMS_KEY_ARN || '' }}
      TF_VAR_existing_acm_certificate_arn: ${{ vars.PROD_ACM_CERTIFICATE_ARN || '' }}
      TF_VAR_alarm_action_arns: ${{ vars.PROD_ALARM_ACTION_ARNS_JSON }}
      TF_VAR_default_from_email: ${{ vars.PROD_DEFAULT_FROM_EMAIL || 'noreply@releviz.com' }}
      TF_VAR_amplify_app_id: ${{ vars.PROD_AMPLIFY_APP_ID }}

    steps:
      - name: Record production job time budget
        id: job_budget
        run: echo "started_at=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Confirm protected production release
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "DEPLOY" ]; then
            echo "::error::Production releases require the exact confirmation DEPLOY."
            exit 1
          fi
          if ! [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The selected release is not an immutable Git commit SHA."
            exit 1
          fi

      - name: Checkout selected main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Verify the exact checked-out release
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$DEPLOY_SHA" ]; then
            echo "::error::Checkout is ${checked_out_sha}; expected ${DEPLOY_SHA}."
            exit 1
          fi

      - name: Verify CI Result passed for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${DEPLOY_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI Result")] | sort_by(.completed_at) | last | .conclusion // ""')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI Result for ${DEPLOY_SHA} is '${conclusion:-missing}', not success."
            exit 1
          fi

      - name: Validate production configuration
        env:
          ROUTE53_ZONE_ID: ${{ vars.PROD_ROUTE53_ZONE_ID }}
          DJANGO_SECRET_KEY_ARN: ${{ vars.PROD_DJANGO_SECRET_KEY_ARN }}
          FIELD_ENCRYPTION_KEY_ARN: ${{ vars.PROD_DJANGO_FIELD_ENCRYPTION_KEY_ARN }}
          METRICS_BEARER_TOKEN_ARN: ${{ vars.PROD_METRICS_BEARER_TOKEN_ARN }}
          DEFAULT_ADMIN_PASSWORD_SECRET_ARN: ${{ vars.PROD_DEFAULT_ADMIN_PASSWORD_SECRET_ARN }}
          AMPLIFY_APP_ID: ${{ vars.PROD_AMPLIFY_APP_ID }}
          ALARM_ACTION_ARNS: ${{ vars.PROD_ALARM_ACTION_ARNS_JSON }}
        run: |
          set -euo pipefail
          for required in \
            AWS_ROLE_ARN \
            TF_STATE_BUCKET \
            PROD_DOMAIN \
            ROUTE53_ZONE_ID \
            DJANGO_SECRET_KEY_ARN \
            FIELD_ENCRYPTION_KEY_ARN \
            METRICS_BEARER_TOKEN_ARN \
            DEFAULT_ADMIN_EMAIL \
            DEFAULT_ADMIN_PASSWORD_SECRET_ARN \
            AMPLIFY_APP_ID \
            ALARM_ACTION_ARNS; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Missing required Production environment variable: $required"
              exit 1
            fi
          done
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and startswith("arn:"))' \
            <<<"$ALARM_ACTION_ARNS" >/dev/null; then
            echo "::error::PROD_ALARM_ACTION_ARNS_JSON must be a non-empty JSON array of SNS ARNs."
            exit 1
          fi
          if ! [[ "$AMPLIFY_APP_ID" =~ ^d[a-z0-9]{1,19}$ ]]; then
            echo "::error::PROD_AMPLIFY_APP_ID must be an exact Amplify app ID."
            exit 1
          fi
          if [ "$DEFAULT_ADMIN_EMAIL" != "admin@releviz.com" ]; then
            echo "::error::PROD_DEFAULT_ADMIN_EMAIL must be the reviewed address admin@releviz.com."
            exit 1
          fi
          if ! [[ "$DEFAULT_ADMIN_PASSWORD_SECRET_ARN" =~ ^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:releviz/prod/default-admin-password-[A-Za-z0-9]{6}$ ]]; then
            echo "::error::PROD_DEFAULT_ADMIN_PASSWORD_SECRET_ARN must be the complete ARN for releviz/prod/default-admin-password."
            exit 1
          fi
          if ! jq -en \
            --arg django "$DJANGO_SECRET_KEY_ARN" \
            --arg field "$FIELD_ENCRYPTION_KEY_ARN" \
            --arg metrics "$METRICS_BEARER_TOKEN_ARN" \
            --arg admin "$DEFAULT_ADMIN_PASSWORD_SECRET_ARN" '
              [$django, $field, $metrics, $admin] as $secrets
              | ($secrets | length) == ($secrets | unique | length)
            ' >/dev/null; then
            echo "::error::Production application secrets must use four distinct ARNs."
            exit 1
          fi
          for domain in "$PROD_DOMAIN" "$API_DOMAIN" "$LEGACY_ORIGIN_DOMAIN"; do
            if ! [[ "$domain" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$ ]]; then
              echo "::error::Invalid production hostname: ${domain}"
              exit 1
            fi
          done
          if [ "$API_DOMAIN" = "$PROD_DOMAIN" ] ||
            [ "$LEGACY_ORIGIN_DOMAIN" = "$PROD_DOMAIN" ] ||
            [ "$LEGACY_ORIGIN_DOMAIN" = "$API_DOMAIN" ]; then
            echo "::error::Frontend, API, and transitional origin hostnames must be distinct."
            exit 1
          fi
          if [ "$API_DOMAIN" != "api.releviz.com" ]; then
            echo "::error::PROD_API_DOMAIN must be the reviewed hostname api.releviz.com."
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-duration-seconds: 10800
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify deployment identity and managed dependencies
        env:
          DJANGO_SECRET_KEY_ARN: ${{ vars.PROD_DJANGO_SECRET_KEY_ARN }}
          FIELD_ENCRYPTION_KEY_ARN: ${{ vars.PROD_DJANGO_FIELD_ENCRYPTION_KEY_ARN }}
          METRICS_BEARER_TOKEN_ARN: ${{ vars.PROD_METRICS_BEARER_TOKEN_ARN }}
          DEFAULT_ADMIN_PASSWORD_SECRET_ARN: ${{ vars.PROD_DEFAULT_ADMIN_PASSWORD_SECRET_ARN }}
          SENTRY_DSN_SECRET_ARN: ${{ vars.PROD_SENTRY_DSN_SECRET_ARN }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          for secret_arn in \
            "$DJANGO_SECRET_KEY_ARN" \
            "$FIELD_ENCRYPTION_KEY_ARN" \
            "$METRICS_BEARER_TOKEN_ARN" \
            "$DEFAULT_ADMIN_PASSWORD_SECRET_ARN" \
            "$SENTRY_DSN_SECRET_ARN"; do
            if [ -n "$secret_arn" ]; then
              aws secretsmanager describe-secret --secret-id "$secret_arn" >/dev/null
            fi
          done
          default_admin_secret_name="$(
            aws secretsmanager describe-secret \
              --secret-id "$DEFAULT_ADMIN_PASSWORD_SECRET_ARN" \
              --query Name \
              --output text
          )"
          if [ "$default_admin_secret_name" != "releviz/prod/default-admin-password" ]; then
            echo "::error::The default-admin ARN resolves to an unexpected Secrets Manager name."
            exit 1
          fi
          aws kms describe-key --key-id alias/aws/rds >/dev/null
          aws kms describe-key --key-id alias/aws/secretsmanager >/dev/null
          aws amplify get-app --app-id "$TF_VAR_amplify_app_id" >/dev/null

      - name: Verify protected Terraform state bucket
        run: |
          set -euo pipefail
          aws s3api head-bucket --bucket "$TF_STATE_BUCKET"
          versioning="$(aws s3api get-bucket-versioning \
            --bucket "$TF_STATE_BUCKET" --query Status --output text)"
          if [ "$versioning" != "Enabled" ]; then
            echo "::error::Production Terraform state bucket versioning must be enabled."
            exit 1
          fi
          aws s3api get-bucket-encryption --bucket "$TF_STATE_BUCKET" >/dev/null
          public_block="$(aws s3api get-public-access-block \
            --bucket "$TF_STATE_BUCKET" \
            --query 'PublicAccessBlockConfiguration.[BlockPublicAcls,IgnorePublicAcls,BlockPublicPolicy,RestrictPublicBuckets]' \
            --output text)"
          if [ "$public_block" != $'True\tTrue\tTrue\tTrue' ]; then
            echo "::error::Production Terraform state bucket must block all public access."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Initialize Terraform with remote state
        run: |
          terraform -chdir=infra/prod init -reconfigure -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: Detect API-subdomain transition state
        id: api_transition
        run: |
          set -euo pipefail
          state_list="$(terraform -chdir=infra/prod state list)"
          if grep -q '^aws_route53_record\.api$' <<<"$state_list" &&
            ! grep -Eq '^aws_lb_listener_rule\.backend(\[0\])?$' <<<"$state_list"; then
            compatibility=false
          else
            compatibility=true
          fi
          echo "compatibility=$compatibility" >>"$GITHUB_OUTPUT"
          echo "::notice::Legacy API compatibility required for this release: ${compatibility}."

      - name: Install reviewed Amplify security headers
        run: |
          set -euo pipefail
          custom_headers="$(jq -c . infra/prod/amplify-custom-headers.json)"
          aws amplify update-app \
            --app-id "$TF_VAR_amplify_app_id" \
            --custom-headers "$custom_headers" >/dev/null
          live_headers="$(
            aws amplify get-app \
              --app-id "$TF_VAR_amplify_app_id" \
              --query app.customHeaders \
              --output text
          )"
          if ! grep -Fq "https://${API_DOMAIN}" <<<"$live_headers"; then
            echo "::error::Amplify did not retain the reviewed API connect-src policy."
            exit 1
          fi

      - name: Preserve the deployed ECS frontend as a hot rollback
        id: rollback_frontend
        run: |
          set -euo pipefail
          cluster_name="$(terraform -chdir=infra/prod output -raw ecs_cluster_name)"
          frontend_service="$(terraform -chdir=infra/prod output -raw frontend_service_name)"
          task_definition="$(
            aws ecs describe-services \
              --cluster "$cluster_name" \
              --services "$frontend_service" \
              --query "services[0].taskDefinition" \
              --output text
          )"
          image_uri="$(
            aws ecs describe-task-definition \
              --task-definition "$task_definition" \
              --query "taskDefinition.containerDefinitions[0].image" \
              --output text
          )"
          rollback_sha="${image_uri##*:}"
          if ! [[ "$rollback_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The deployed ECS frontend is not tagged with an immutable Git SHA: ${image_uri}"
            exit 1
          fi
          if [[ "$image_uri" != */"${ECR_FRONTEND}:${rollback_sha}" ]]; then
            echo "::error::The deployed ECS frontend does not use the configured rollback repository."
            exit 1
          fi
          {
            echo "sha=$rollback_sha"
            echo "task_definition=$task_definition"
          } >>"$GITHUB_OUTPUT"

      - name: Detect an existing Amplify domain association
        id: domain_state
        run: |
          set -euo pipefail
          app_id="$TF_VAR_amplify_app_id"
          domain_name="${PROD_DOMAIN%.}"
          state_address='aws_amplify_domain_association.frontend[0]'
          association_file="${RUNNER_TEMP}/existing-amplify-domain-association.json"
          association_error="${RUNNER_TEMP}/existing-amplify-domain-association.error"
          state_list="$(terraform -chdir=infra/prod state list)"
          if grep -q '^aws_amplify_domain_association\.frontend\[0\]$' <<<"$state_list"; then
            if [ -z "$app_id" ]; then
              echo "::error::Terraform tracks the Amplify domain but no app ID is configured."
              exit 1
            fi
            if ! aws amplify get-domain-association \
              --app-id "$app_id" \
              --domain-name "$domain_name" \
              --output json >"$association_file" 2>"$association_error"; then
              echo "::error::Terraform tracks the Amplify domain but the exact AWS association could not be verified."
              cat "$association_error" >&2
              exit 1
            fi
            instance_status="$(
              terraform -chdir=infra/prod state pull |
                jq -er '
                  [
                    .resources[]
                    | select(
                        .mode == "managed" and
                        .type == "aws_amplify_domain_association" and
                        .name == "frontend"
                      )
                    | .instances[]
                    | select(.index_key == 0)
                    | (.status // "ready")
                  ]
                  | if length == 1 then .[0]
                    else error("expected exactly one Amplify domain instance")
                    end
                '
            )"
            case "$instance_status" in
              ready)
                recovered_taint=false
                ;;
              tainted)
                terraform -chdir=infra/prod untaint "$state_address"
                recovered_taint=true
                echo "::notice::Recovered the verified Amplify domain association from tainted Terraform state."
                ;;
              *)
                echo "::error::Unexpected Amplify domain Terraform state: ${instance_status}"
                exit 1
                ;;
            esac
            preexisting=true
            recovered_orphan=false
          else
            if [ -z "$app_id" ]; then
              preexisting=false
              recovered_orphan=false
              recovered_taint=false
            elif aws amplify get-domain-association \
              --app-id "$app_id" \
              --domain-name "$domain_name" \
              --output json >"$association_file" 2>"$association_error"; then
              export TF_VAR_enable_amplify_domain=true
              terraform -chdir=infra/prod import \
                -input=false \
                'aws_amplify_domain_association.frontend[0]' \
                "${app_id}/${domain_name}"
              if ! terraform -chdir=infra/prod state list |
                grep -q '^aws_amplify_domain_association\.frontend\[0\]$'; then
                echo "::error::The orphan Amplify domain association was not imported."
                exit 1
              fi
              preexisting=true
              recovered_orphan=true
              recovered_taint=false
              echo "::notice::Recovered the existing Amplify domain association into Terraform state."
            elif grep -q 'NotFoundException' "$association_error"; then
              preexisting=false
              recovered_orphan=false
              recovered_taint=false
            else
              echo "::error::Unable to determine whether an orphan Amplify domain association exists."
              cat "$association_error" >&2
              exit 1
            fi
          fi
          {
            echo "preexisting=$preexisting"
            echo "recovered_orphan=$recovered_orphan"
            echo "recovered_taint=$recovered_taint"
          } >>"$GITHUB_OUTPUT"

      - name: Capture pre-release canonical Route53 alias
        id: apex_alias
        env:
          AMPLIFY_APP_ID: ${{ vars.PROD_AMPLIFY_APP_ID }}
          PRODUCTION_BRANCH: main
          ROUTE53_ZONE_ID: ${{ vars.PROD_ROUTE53_ZONE_ID }}
        run: |
          set -euo pipefail
          canonical_name="${PROD_DOMAIN%.}."
          records_file="${RUNNER_TEMP}/pre-release-route53-records.json"
          alias_file="${RUNNER_TEMP}/pre-release-apex-a-alias.json"
          matches_file="${RUNNER_TEMP}/pre-release-apex-a-aliases.json"
          aws route53 list-resource-record-sets \
            --hosted-zone-id "$ROUTE53_ZONE_ID" \
            --output json >"$records_file"
          jq \
            --arg name "$canonical_name" \
            '[.ResourceRecordSets[] | select(.Name == $name and .Type == "A")]' \
            "$records_file" >"$matches_file"
          if ! jq -e '
            length == 1
            and (.[0].AliasTarget | type == "object")
            and (.[0].AliasTarget.DNSName | type == "string" and length > 0)
          ' "$matches_file" >/dev/null; then
            echo "::error::Expected exactly one canonical Route53 A alias for ${canonical_name}."
            exit 1
          fi
          jq '.[0]' "$matches_file" >"$alias_file"

          alias_target="$(
            jq -r '.AliasTarget.DNSName | ascii_downcase | rtrimstr(".")' "$alias_file"
          )"
          alb_dns_name="$(
            terraform -chdir=infra/prod output -raw alb_dns_name |
              tr '[:upper:]' '[:lower:]' |
              sed 's/\.$//'
          )"
          normalized_alias_target="${alias_target#dualstack.}"
          routes_to_alb=false
          if [ "$normalized_alias_target" = "$alb_dns_name" ]; then
            routes_to_alb=true
          fi
          if [ "${{ steps.domain_state.outputs.preexisting }}" = "true" ] &&
            [ "$routes_to_alb" != "true" ]; then
            association="$(
              aws amplify get-domain-association \
                --app-id "$AMPLIFY_APP_ID" \
                --domain-name "$PROD_DOMAIN" \
                --output json
            )"
            expected_amplify_target="$(
              bash scripts/deploy/amplify-apex-target.sh \
                "$PRODUCTION_BRANCH" <<<"$association"
            )"
            if [ -z "$expected_amplify_target" ] ||
              [ "$alias_target" != "$expected_amplify_target" ]; then
              echo "::error::The canonical alias is neither the managed ALB fallback nor Amplify's exact reported apex target; refusing deployment."
              exit 1
            fi
          fi
          if [ "${{ steps.domain_state.outputs.preexisting }}" != "true" ] &&
            [ "$routes_to_alb" != "true" ]; then
            echo "::error::The first Amplify cutover requires the canonical alias to target the managed ALB."
            exit 1
          fi
          {
            echo "record_file=$alias_file"
            echo "routes_to_alb=$routes_to_alb"
            echo "alb_dns_name=$alb_dns_name"
            echo "pre_release_alias_target=$alias_target"
          } >>"$GITHUB_OUTPUT"
          echo "::notice::Captured the exact pre-release canonical A alias; routes_to_alb=${routes_to_alb}."

      - name: Ensure immutable application ECR repositories exist
        run: |
          set -euo pipefail
          for repository in "$ECR_BACKEND" "$ECR_FRONTEND"; do
            if ! aws ecr describe-repositories --repository-names "$repository" >/dev/null 2>&1; then
              aws ecr create-repository \
                --repository-name "$repository" \
                --image-tag-mutability IMMUTABLE \
                --image-scanning-configuration scanOnPush=true >/dev/null
            else
              aws ecr put-image-tag-mutability \
                --repository-name "$repository" \
                --image-tag-mutability IMMUTABLE >/dev/null
              aws ecr put-image-scanning-configuration \
                --repository-name "$repository" \
                --image-scanning-configuration scanOnPush=true >/dev/null
            fi
          done

      - name: Check whether immutable backend image already exists
        id: backend_image
        run: |
          set -euo pipefail
          if aws ecr describe-images \
            --repository-name "$ECR_BACKEND" \
            --image-ids "imageTag=${DEPLOY_SHA}" >/dev/null 2>&1; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Check whether immutable ECS fallback frontend image already exists
        id: frontend_image
        run: |
          set -euo pipefail
          if aws ecr describe-images \
            --repository-name "$ECR_FRONTEND" \
            --image-ids "imageTag=${DEPLOY_SHA}" >/dev/null 2>&1; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Login to Amazon ECR
        if: >-
          ${{ steps.backend_image.outputs.exists != 'true' ||
              steps.frontend_image.outputs.exists != 'true' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable backend image
        if: ${{ steps.backend_image.outputs.exists != 'true' }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          image_uri="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_BACKEND}:${DEPLOY_SHA}"
          docker build --pull --tag "$image_uri" ./src/backend
          docker push "$image_uri"

      - name: Build and push immutable ECS fallback frontend image
        if: ${{ steps.frontend_image.outputs.exists != 'true' }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          image_uri="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_FRONTEND}:${DEPLOY_SHA}"
          docker build \
            --pull \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=https://${API_DOMAIN}" \
            --tag "$image_uri" \
            ./src/frontend
          docker push "$image_uri"

      - name: Install frontend dependencies
        run: npm ci --workspace=releviz-frontend

      - name: Build Amplify static artifact
        env:
          NEXT_PUBLIC_API_BASE_URL: https://${{ env.API_DOMAIN }}
        run: |
          set -euo pipefail
          npm --workspace=releviz-frontend run build:amplify
          python3 scripts/ci/validate_amplify_static_export.py \
            --out src/frontend/out \
            --manifest src/frontend/amplify-routes.json
          jq -n --arg sha "$DEPLOY_SHA" '{sha: $sha}' >src/frontend/out/release.json
          (
            cd src/frontend/out
            zip -q -r "$AMPLIFY_ARTIFACT" .
          )
          unzip -tq "$AMPLIFY_ARTIFACT"
          (
            cd "$(dirname "$AMPLIFY_ARTIFACT")"
            artifact_name="$(basename "$AMPLIFY_ARTIFACT")"
            sha256sum "$artifact_name" | tee "${artifact_name}.sha256"
          )

      - name: Retain immutable Amplify artifact for rollback
        uses: actions/upload-artifact@v7
        with:
          name: releviz-amplify-${{ env.DEPLOY_SHA }}
          path: |
            ${{ env.AMPLIFY_ARTIFACT }}
            ${{ env.AMPLIFY_ARTIFACT }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Plan production infrastructure with current DNS state
        env:
          TF_VAR_enable_amplify_domain: ${{ steps.domain_state.outputs.preexisting }}
          TF_VAR_enable_legacy_api_compatibility: ${{ steps.api_transition.outputs.compatibility }}
          TF_VAR_frontend_image_tag: ${{ steps.rollback_frontend.outputs.sha }}
        run: terraform -chdir=infra/prod plan -input=false -out=production-base.tfplan

      - name: Guard live Amplify configuration before candidate smoke
        env:
          CANONICAL_ROUTES_TO_ALB: ${{ steps.apex_alias.outputs.routes_to_alb }}
          DOMAIN_PREEXISTING: ${{ steps.domain_state.outputs.preexisting }}
        run: |
          set -euo pipefail
          live_configuration_actions="$(
            terraform -chdir=infra/prod show -json production-base.tfplan |
              jq -ce '
                [
                  .resource_changes[]?
                  | select(
                      .address == "aws_amplify_app.frontend"
                      or .address == "aws_amplify_branch.production"
                      or .address == "aws_amplify_domain_association.frontend[0]"
                    )
                  | {
                      address,
                      actions: .change.actions
                    }
                  | select(.actions != ["no-op"])
                ]
              '
          )"
          if [ "$DOMAIN_PREEXISTING" = "true" ] &&
            [ "$CANONICAL_ROUTES_TO_ALB" != "true" ] &&
            [ "$live_configuration_actions" != "[]" ]; then
            echo "::error::The reviewed plan changes live Amplify app, production-branch, or domain configuration before candidate smoke: ${live_configuration_actions}"
            echo "::error::Move the canonical alias to the documented ECS fallback before applying global Amplify configuration changes."
            exit 1
          fi

      - name: Apply exact production base plan
        id: base_apply
        run: terraform -chdir=infra/prod apply -input=false -auto-approve production-base.tfplan

      - name: Capture deployed AWS resources
        id: terraform
        run: |
          {
            echo "cluster_name=$(terraform -chdir=infra/prod output -raw ecs_cluster_name)"
            echo "backend_service=$(terraform -chdir=infra/prod output -raw backend_service_name)"
            echo "frontend_service=$(terraform -chdir=infra/prod output -raw frontend_service_name)"
            echo "default_admin_task_definition=$(terraform -chdir=infra/prod output -raw default_admin_task_definition_arn)"
            echo "default_admin_container=$(terraform -chdir=infra/prod output -raw default_admin_container_name)"
            echo "event_reminders_rule=$(terraform -chdir=infra/prod output -raw event_reminders_rule_name)"
            echo "alb_dns_name=$(terraform -chdir=infra/prod output -raw alb_dns_name)"
            echo "api_domain=$(terraform -chdir=infra/prod output -raw api_domain)"
            echo "amplify_app_id=$(terraform -chdir=infra/prod output -raw amplify_app_id)"
            echo "amplify_default_domain=$(terraform -chdir=infra/prod output -raw amplify_default_domain)"
            echo "candidate_branch=$(terraform -chdir=infra/prod output -raw amplify_candidate_branch_name)"
            echo "production_branch=$(terraform -chdir=infra/prod output -raw amplify_production_branch_name)"
          } >>"$GITHUB_OUTPUT"

      - name: Wait for backend and rollback frontend ECS services
        run: |
          aws ecs wait services-stable \
            --cluster "${{ steps.terraform.outputs.cluster_name }}" \
            --services \
              "${{ steps.terraform.outputs.backend_service }}" \
              "${{ steps.terraform.outputs.frontend_service }}"

      - name: Verify base ECS services use Terraform-selected task definitions
        run: |
          set -euo pipefail
          for role in backend frontend; do
            if [ "$role" = "backend" ]; then
              service="${{ steps.terraform.outputs.backend_service }}"
            else
              service="${{ steps.terraform.outputs.frontend_service }}"
            fi
            expected="$(
              terraform -chdir=infra/prod output -raw "${role}_task_definition_arn"
            )"
            service_state="$(
              aws ecs describe-services \
                --cluster "${{ steps.terraform.outputs.cluster_name }}" \
                --services "$service" \
                --output json
            )"
            if ! jq -e --arg expected "$expected" '
              (.failures | length) == 0
              and (.services | length) == 1
              and .services[0].taskDefinition == $expected
              and (
                [.services[0].deployments[] | select(.status == "PRIMARY")]
                | length
              ) == 1
              and (
                [
                  .services[0].deployments[]
                  | select(.status == "PRIMARY")
                  | .taskDefinition
                ] == [$expected]
              )
            ' <<<"$service_state" >/dev/null; then
              echo "::error::The ${role} service stabilized on a task definition other than the reviewed Terraform release."
              jq -r '
                .services[0]
                | {
                    taskDefinition,
                    deployments: [
                      .deployments[]
                      | {status, rolloutState, taskDefinition}
                    ]
                  }
              ' <<<"$service_state" >&2
              exit 1
            fi

            task_list="$(
              aws ecs list-tasks \
                --cluster "${{ steps.terraform.outputs.cluster_name }}" \
                --service-name "$service" \
                --desired-status RUNNING \
                --output json
            )"
            mapfile -t task_arns < <(jq -r '.taskArns[]' <<<"$task_list")
            if [ "${#task_arns[@]}" -eq 0 ]; then
              echo "::error::The ${role} service has no running tasks after stabilization."
              exit 1
            fi
            running_tasks="$(
              aws ecs describe-tasks \
                --cluster "${{ steps.terraform.outputs.cluster_name }}" \
                --tasks "${task_arns[@]}" \
                --output json
            )"
            if ! jq -e --arg expected "$expected" '
              (.failures | length) == 0
              and (.tasks | length) > 0
              and all(
                .tasks[];
                .lastStatus == "RUNNING"
                and .taskDefinitionArn == $expected
              )
            ' <<<"$running_tasks" >/dev/null; then
              echo "::error::The ${role} service has running tasks outside the reviewed Terraform release."
              jq -r '
                .tasks[]
                | {taskArn, lastStatus, taskDefinitionArn}
              ' <<<"$running_tasks" >&2
              exit 1
            fi
          done

      - name: Verify backend ALB target health
        run: |
          set -euo pipefail
          target_group="$(
            aws ecs describe-services \
              --cluster "${{ steps.terraform.outputs.cluster_name }}" \
              --services "${{ steps.terraform.outputs.backend_service }}" \
              --query "services[0].loadBalancers[0].targetGroupArn" \
              --output text
          )"
          for attempt in $(seq 1 30); do
            health="$(aws elbv2 describe-target-health --target-group-arn "$target_group")"
            if jq -e '
              [.TargetHealthDescriptions[].TargetHealth.State] as $states
              | ($states | length) > 0
              and all($states[]; . == "healthy")
            ' <<<"$health" >/dev/null; then
              exit 0
            fi
            echo "Backend target health is converging; attempt=${attempt}/30"
            jq -r '.TargetHealthDescriptions[].TargetHealth.State' <<<"$health"
            sleep 10
          done
          echo "::error::Backend ALB targets did not become healthy."
          exit 1

      - name: Run pre-Amplify backend smoke tests
        env:
          API_COMPATIBILITY: ${{ steps.api_transition.outputs.compatibility }}
          DEPLOYED_API_DOMAIN: ${{ steps.terraform.outputs.api_domain }}
        run: |
          set -euo pipefail
          for path in /health/live /health /admin/; do
            curl \
              --connect-timeout 5 \
              --fail \
              --location \
              --max-time 20 \
              --show-error \
              --retry 20 \
              --retry-all-errors \
              --retry-delay 5 \
              "https://${DEPLOYED_API_DOMAIN}${path}" >/dev/null
          done
          if [ "$API_COMPATIBILITY" = "true" ]; then
            for path in /api/health/live /api/health /admin/; do
              curl \
                --connect-timeout 5 \
                --fail \
                --location \
                --max-time 20 \
                --show-error \
                --retry 20 \
                --retry-all-errors \
                --retry-delay 5 \
                "https://${PROD_DOMAIN}${path}" >/dev/null
            done
          fi

      - name: Ensure production default administrator through one-off ECS task
        id: default_admin
        env:
          CLUSTER_NAME: ${{ steps.terraform.outputs.cluster_name }}
          BACKEND_SERVICE: ${{ steps.terraform.outputs.backend_service }}
          DEFAULT_ADMIN_TASK_DEFINITION: ${{ steps.terraform.outputs.default_admin_task_definition }}
          DEFAULT_ADMIN_CONTAINER: ${{ steps.terraform.outputs.default_admin_container }}
        run: |
          set -euo pipefail
          task_arn=""
          started_by="admin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          admin_task_verified="false"
          if ! [[ "$started_by" =~ ^[A-Za-z0-9_-]{1,36}$ ]]; then
            echo "::error::The generated ECS started-by token is invalid."
            exit 1
          fi
          echo "started_by=${started_by}" >>"$GITHUB_OUTPUT"

          discover_default_admin_tasks() {
            local attempt
            local discovered=""
            for attempt in 1 2 3 4 5 6; do
              discovered="$(
                aws ecs list-tasks \
                  --cluster "$CLUSTER_NAME" \
                  --started-by "$started_by" \
                  --query taskArns \
                  --output text 2>/dev/null || true
              )"
              if [ -n "$discovered" ] && [ "$discovered" != "None" ]; then
                printf '%s\n' "$discovered"
                return
              fi
              if [ "$attempt" -lt 6 ]; then
                sleep 2
              fi
            done
          }

          cleanup_default_admin_task() {
            local candidate
            local discovered_tasks=""
            local task_status=""
            local -a discovered=()
            local -A seen=()
            if [ "$admin_task_verified" = "true" ]; then
              return
            fi
            discovered_tasks="$(discover_default_admin_tasks)"
            read -r -a discovered <<<"$discovered_tasks"
            if [ -n "$task_arn" ]; then
              discovered+=("$task_arn")
            fi
            for candidate in "${discovered[@]}"; do
              if [ -z "$candidate" ] || [ -n "${seen[$candidate]:-}" ]; then
                continue
              fi
              seen["$candidate"]=1
              task_status="$(
                aws ecs describe-tasks \
                  --cluster "$CLUSTER_NAME" \
                  --tasks "$candidate" \
                  --query 'tasks[0].lastStatus' \
                  --output text 2>/dev/null || true
              )"
              if [ -n "$task_status" ] &&
                [ "$task_status" != "None" ] &&
                [ "$task_status" != "STOPPED" ]; then
                aws ecs stop-task \
                  --cluster "$CLUSTER_NAME" \
                  --task "$candidate" \
                  --reason "Production default-admin bootstrap cleanup" >/dev/null || true
                timeout --signal=TERM 180s \
                  aws ecs wait tasks-stopped \
                  --cluster "$CLUSTER_NAME" \
                  --tasks "$candidate" || true
              fi
            done
          }
          trap cleanup_default_admin_task EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          expected_task_definition="$(
            terraform -chdir=infra/prod output -raw default_admin_task_definition_arn
          )"
          expected_container="$(
            terraform -chdir=infra/prod output -raw default_admin_container_name
          )"
          if [ "$DEFAULT_ADMIN_TASK_DEFINITION" != "$expected_task_definition" ] ||
            [ "$DEFAULT_ADMIN_CONTAINER" != "$expected_container" ]; then
            echo "::error::Captured default-admin task identity differs from the reviewed Terraform outputs."
            exit 1
          fi

          task_definition_state="$(
            aws ecs describe-task-definition \
              --task-definition "$expected_task_definition" \
              --output json
          )"
          if ! jq -e \
            --arg expected "$expected_task_definition" \
            --arg container "$expected_container" \
            --arg email "$DEFAULT_ADMIN_EMAIL" \
            --arg password_secret "${TF_VAR_default_admin_password_secret_arn}:password::" '
              .taskDefinition.taskDefinitionArn == $expected
              and .taskDefinition.family == "releviz-prod-default-admin-task"
              and .taskDefinition.networkMode == "awsvpc"
              and (.taskDefinition.requiresCompatibilities | index("FARGATE")) != null
              and ((.taskDefinition.taskRoleArn // "") == "")
              and (.taskDefinition.containerDefinitions | length) == 1
              and .taskDefinition.containerDefinitions[0].name == $container
              and .taskDefinition.containerDefinitions[0].command
                == ["python", "manage.py", "ensure_default_admin", "--yes", "--create-only"]
              and (
                [
                  .taskDefinition.containerDefinitions[0].environment[]
                  | select(.name == "DJANGO_SKIP_STARTUP_TASKS" and .value == "1")
                ] | length
              ) == 1
              and (
                [
                  .taskDefinition.containerDefinitions[0].environment[]
                  | select(.name == "DJANGO_CREATE_DEFAULT_ADMIN" and .value == "0")
                ] | length
              ) == 1
              and (
                [
                  .taskDefinition.containerDefinitions[0].environment[]
                  | select(.name == "DJANGO_SUPERUSER_EMAIL" and .value == $email)
                ] | length
              ) == 1
              and (
                [
                  .taskDefinition.containerDefinitions[0].secrets[]
                  | select(
                      .name == "DJANGO_SUPERUSER_PASSWORD"
                      and .valueFrom == $password_secret
                    )
                ] | length
              ) == 1
            ' <<<"$task_definition_state" >/dev/null; then
            echo "::error::The default-admin task definition does not match the reviewed bootstrap contract."
            exit 1
          fi
          default_admin_image="$(
            jq -er '.taskDefinition.containerDefinitions[0].image' <<<"$task_definition_state"
          )"

          service_state="$(
            aws ecs describe-services \
              --cluster "$CLUSTER_NAME" \
              --services "$BACKEND_SERVICE" \
              --output json
          )"
          if ! jq -e '
            (.failures | length) == 0
            and (.services | length) == 1
            and (
              .services[0].networkConfiguration.awsvpcConfiguration
              | (.subnets | length) > 0
              and (.securityGroups | length) > 0
              and .assignPublicIp == "DISABLED"
            )
          ' <<<"$service_state" >/dev/null; then
            echo "::error::The backend service does not expose a valid private Fargate network configuration."
            exit 1
          fi
          backend_task_definition="$(jq -er '.services[0].taskDefinition' <<<"$service_state")"
          backend_task_state="$(
            aws ecs describe-task-definition \
              --task-definition "$backend_task_definition" \
              --output json
          )"
          if ! jq -e \
            --arg expected "$backend_task_definition" '
              .taskDefinition.taskDefinitionArn == $expected
              and all(
                .taskDefinition.containerDefinitions[].secrets[]?;
                .name != "DJANGO_SUPERUSER_PASSWORD"
              )
              and all(
                .taskDefinition.containerDefinitions[].environment[]?;
                .name != "DJANGO_SUPERUSER_EMAIL"
              )
              and (
                [
                  .taskDefinition.containerDefinitions[].environment[]
                  | select(.name == "DJANGO_CREATE_DEFAULT_ADMIN" and .value == "0")
                ] | length
              ) == 1
            ' <<<"$backend_task_state" >/dev/null; then
            echo "::error::The long-running backend task exposes administrator bootstrap inputs."
            exit 1
          fi
          backend_image="$(
            jq -er '.taskDefinition.containerDefinitions[0].image' <<<"$backend_task_state"
          )"
          if [ "$default_admin_image" != "$backend_image" ]; then
            echo "::error::The default-admin task does not use the deployed immutable backend image."
            exit 1
          fi
          network_configuration="$(
            jq -cer '
              {
                awsvpcConfiguration:
                  .services[0].networkConfiguration.awsvpcConfiguration
              }
            ' <<<"$service_state"
          )"

          run_state="$(
            aws ecs run-task \
              --cluster "$CLUSTER_NAME" \
              --launch-type FARGATE \
              --task-definition "$expected_task_definition" \
              --network-configuration "$network_configuration" \
              --count 1 \
              --started-by "$started_by" \
              --tags \
                key=Project,value=releviz \
                key=Environment,value=prod \
                key=Purpose,value=default-admin-bootstrap \
              --output json
          )"
          task_arn="$(jq -er '.tasks[0].taskArn // empty' <<<"$run_state" || true)"
          if [ -n "$task_arn" ]; then
            echo "task_arn=${task_arn}" >>"$GITHUB_OUTPUT"
          fi
          if ! jq -e \
            --arg expected "$expected_task_definition" '
              (.failures | length) == 0
              and (.tasks | length) == 1
              and .tasks[0].taskDefinitionArn == $expected
            ' <<<"$run_state" >/dev/null; then
            echo "::error::ECS did not start exactly one reviewed default-admin task."
            jq -c '{failures, taskCount: (.tasks | length)}' <<<"$run_state" >&2
            exit 1
          fi

          if ! timeout --signal=TERM 900s \
            aws ecs wait tasks-stopped \
              --cluster "$CLUSTER_NAME" \
              --tasks "$task_arn"; then
            echo "::error::Timed out waiting for the default-admin task to stop."
            exit 1
          fi
          stopped_state="$(
            aws ecs describe-tasks \
              --cluster "$CLUSTER_NAME" \
              --tasks "$task_arn" \
              --output json
          )"
          if ! jq -e \
            --arg expected "$expected_task_definition" \
            --arg container "$expected_container" '
              (.failures | length) == 0
              and (.tasks | length) == 1
              and .tasks[0].taskDefinitionArn == $expected
              and .tasks[0].lastStatus == "STOPPED"
              and .tasks[0].stopCode == "EssentialContainerExited"
              and (
                [
                  .tasks[0].containers[]
                  | select(
                      .name == $container
                      and .lastStatus == "STOPPED"
                      and .exitCode == 0
                    )
                ] | length
              ) == 1
            ' <<<"$stopped_state" >/dev/null; then
            echo "::error::The production default administrator was not created or verified."
            jq -c '
              {
                failures,
                tasks: [
                  .tasks[]
                  | {
                      taskArn,
                      taskDefinitionArn,
                      lastStatus,
                      stopCode,
                      stoppedReason,
                      containers: [
                        .containers[]
                        | {name, lastStatus, exitCode, reason}
                      ]
                    }
                ]
              }
            ' <<<"$stopped_state" >&2
            exit 1
          fi
          admin_task_verified="true"
          trap - EXIT INT TERM

      - name: Clean up an interrupted default-administrator task
        if: ${{ always() && steps.default_admin.outcome != 'success' && steps.default_admin.outputs.started_by != '' }}
        env:
          CLUSTER_NAME: ${{ steps.terraform.outputs.cluster_name }}
          DEFAULT_ADMIN_STARTED_BY: ${{ steps.default_admin.outputs.started_by }}
        run: |
          set -euo pipefail
          discover_default_admin_tasks() {
            local attempt
            local discovered=""
            for attempt in 1 2 3 4 5 6; do
              discovered="$(
                aws ecs list-tasks \
                  --cluster "$CLUSTER_NAME" \
                  --started-by "$DEFAULT_ADMIN_STARTED_BY" \
                  --query taskArns \
                  --output text
              )"
              if [ -n "$discovered" ] && [ "$discovered" != "None" ]; then
                printf '%s\n' "$discovered"
                return
              fi
              if [ "$attempt" -lt 6 ]; then
                sleep 2
              fi
            done
          }

          discovered_tasks="$(discover_default_admin_tasks)"
          read -r -a task_arns <<<"$discovered_tasks"
          for task_arn in "${task_arns[@]}"; do
            if [ -z "$task_arn" ]; then
              continue
            fi
            task_status="$(
              aws ecs describe-tasks \
                --cluster "$CLUSTER_NAME" \
                --tasks "$task_arn" \
                --query 'tasks[0].lastStatus' \
                --output text
            )"
            if [ "$task_status" != "STOPPED" ]; then
              aws ecs stop-task \
                --cluster "$CLUSTER_NAME" \
                --task "$task_arn" \
                --reason "Production default-admin bootstrap compensation" >/dev/null
              timeout --signal=TERM 180s \
                aws ecs wait tasks-stopped \
                  --cluster "$CLUSTER_NAME" \
                  --tasks "$task_arn"
            fi
            stopped_status="$(
              aws ecs describe-tasks \
                --cluster "$CLUSTER_NAME" \
                --tasks "$task_arn" \
                --query 'tasks[0].lastStatus' \
                --output text
            )"
            if [ "$stopped_status" != "STOPPED" ]; then
              echo "::error::The interrupted default-admin task is still running."
              exit 1
            fi
          done

      - name: Fail closed when an Amplify release job is active
        env:
          AMPLIFY_APP_ID: ${{ steps.terraform.outputs.amplify_app_id }}
          CANDIDATE_BRANCH: ${{ steps.terraform.outputs.candidate_branch }}
          PRODUCTION_BRANCH: ${{ steps.terraform.outputs.production_branch }}
        run: |
          set -euo pipefail
          for branch in "$CANDIDATE_BRANCH" "$PRODUCTION_BRANCH"; do
            jobs="$(
              aws amplify list-jobs \
                --app-id "$AMPLIFY_APP_ID" \
                --branch-name "$branch" \
                --max-results 50 \
                --output json
            )"
            active_jobs="$(
              jq -c '
                [
                  (.jobSummaries // [])[]
                  | select(
                      .status == "CREATED"
                      or .status == "PENDING"
                      or .status == "PROVISIONING"
                      or .status == "RUNNING"
                      or .status == "CANCELLING"
                    )
                  | {jobId, status}
                ]
              ' <<<"$jobs"
            )"
            if [ "$(jq 'length' <<<"$active_jobs")" -ne 0 ]; then
              echo "::error::Amplify branch ${branch} has an active release job: ${active_jobs}"
              echo "::error::Wait for or explicitly stop the prior job before starting a new deployment."
              exit 1
            fi
          done

      - name: Capture current Amplify production rollback point
        id: previous_amplify_production
        env:
          AMPLIFY_DEFAULT_DOMAIN: ${{ steps.terraform.outputs.amplify_default_domain }}
          CANONICAL_ROUTES_TO_ALB: ${{ steps.apex_alias.outputs.routes_to_alb }}
          DOMAIN_PREEXISTING: ${{ steps.domain_state.outputs.preexisting }}
          PRODUCTION_BRANCH: ${{ steps.terraform.outputs.production_branch }}
        run: |
          set -euo pipefail
          previous_sha=""
          if [ "$DOMAIN_PREEXISTING" = "true" ] &&
            [ "$CANONICAL_ROUTES_TO_ALB" != "true" ]; then
            production_url="https://${PRODUCTION_BRANCH}.${AMPLIFY_DEFAULT_DOMAIN}"
            previous_sha="$(
              curl \
                --connect-timeout 5 \
                --fail \
                --max-time 20 \
                --silent \
                --show-error \
                --retry 10 \
                --retry-all-errors \
                --retry-delay 3 \
                "${production_url}/release.json" |
                jq -er .sha
            )"
            if ! [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::The live Amplify branch has no immutable release identity."
              exit 1
            fi
          fi
          echo "sha=$previous_sha" >>"$GITHUB_OUTPUT"

      - name: Resolve retained Amplify rollback artifact
        id: previous_amplify_artifact
        if: >-
          ${{ steps.domain_state.outputs.preexisting == 'true' &&
              steps.apex_alias.outputs.routes_to_alb != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ steps.previous_amplify_production.outputs.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::A valid live Amplify release SHA was not captured."
            exit 1
          fi
          artifact_name="releviz-amplify-${PREVIOUS_SHA}"
          artifact_pages="${RUNNER_TEMP}/amplify-rollback-artifact-pages.json"
          artifact_candidates="${RUNNER_TEMP}/amplify-rollback-artifact-candidates.json"
          verified_candidates="${RUNNER_TEMP}/amplify-rollback-artifact-verified.jsonl"
          gh api \
            --method GET \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
            >"$artifact_pages"
          jq -c \
            --arg name "$artifact_name" \
            --arg sha "$PREVIOUS_SHA" \
            '[
              .[]
              | (.artifacts // [])[]
              | select(.name == $name)
              | select(.expired == false)
              | select(.workflow_run.head_sha == $sha)
              | select(.workflow_run.head_branch == "main")
              | select(
                  .workflow_run.repository_id
                  == .workflow_run.head_repository_id
                )
              | {
                  artifact_id: (.id | tostring),
                  run_id: (.workflow_run.id | tostring),
                  created_at
                }
            ]' "$artifact_pages" >"$artifact_candidates"
          : >"$verified_candidates"
          while IFS=$'\t' read -r artifact_id run_id created_at; do
            run_file="${RUNNER_TEMP}/amplify-rollback-run-${run_id}.json"
            gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >"$run_file"
            if jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg sha "$PREVIOUS_SHA" \
              '
                .head_sha == $sha
                and .head_branch == "main"
                and .path == ".github/workflows/deploy-prod.yml"
                and .event == "workflow_dispatch"
                and .status == "completed"
                and .repository.full_name == $repository
                and .head_repository.full_name == $repository
              ' "$run_file" >/dev/null; then
              jq -nc \
                --arg artifact_id "$artifact_id" \
                --arg run_id "$run_id" \
                --arg created_at "$created_at" \
                '{artifact_id: $artifact_id, run_id: $run_id, created_at: $created_at}' \
                >>"$verified_candidates"
            fi
          done < <(
            jq -r '.[] | [.artifact_id, .run_id, .created_at] | @tsv' \
              "$artifact_candidates"
          )
          if [ ! -s "$verified_candidates" ]; then
            echo "::error::No unexpired retained Amplify artifact for live release ${PREVIOUS_SHA} was produced by a completed trusted production workflow."
            echo "::error::Do not mutate Amplify production without a verified rollback artifact; use the ECS fallback or rebuild the old SHA under review."
            exit 1
          fi
          selected="$(
            jq -sc 'sort_by(.created_at) | last' "$verified_candidates"
          )"
          {
            echo "artifact_id=$(jq -er .artifact_id <<<"$selected")"
            echo "run_id=$(jq -er .run_id <<<"$selected")"
          } >>"$GITHUB_OUTPUT"

      - name: Download retained Amplify rollback artifact
        if: >-
          ${{ steps.domain_state.outputs.preexisting == 'true' &&
              steps.apex_alias.outputs.routes_to_alb != 'true' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.previous_amplify_artifact.outputs.artifact_id }}
          path: ${{ runner.temp }}/amplify-rollback
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_amplify_artifact.outputs.run_id }}
          digest-mismatch: error

      - name: Verify retained Amplify rollback artifact
        id: verify_previous_amplify_artifact
        if: >-
          ${{ steps.domain_state.outputs.preexisting == 'true' &&
              steps.apex_alias.outputs.routes_to_alb != 'true' }}
        env:
          PREVIOUS_SHA: ${{ steps.previous_amplify_production.outputs.sha }}
          ROLLBACK_DIR: ${{ runner.temp }}/amplify-rollback
        run: |
          set -euo pipefail
          expected_archive="releviz-amplify-${PREVIOUS_SHA}.zip"
          expected_checksum="${expected_archive}.sha256"
          archive="${ROLLBACK_DIR}/${expected_archive}"
          checksum="${ROLLBACK_DIR}/${expected_checksum}"
          mapfile -t retained_entries < <(
            find "$ROLLBACK_DIR" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort
          )
          if [ "${#retained_entries[@]}" -ne 2 ] ||
            [ "${retained_entries[0]:-}" != "$expected_archive" ] ||
            [ "${retained_entries[1]:-}" != "$expected_checksum" ] ||
            [ "$(find "$ROLLBACK_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l)" -ne 2 ]; then
            echo "::error::The retained artifact must contain exactly the expected regular ZIP and checksum files."
            printf 'Found: %s\n' "${retained_entries[@]:-none}" >&2
            exit 1
          fi
          checksum_line="$(cat "$checksum")"
          if [ "$(wc -l <"$checksum")" -ne 1 ] ||
            ! [[ "$checksum_line" =~ ^([0-9a-f]{64})[[:space:]]{2}(.+)$ ]] ||
            [ "${BASH_REMATCH[2]:-}" != "$expected_archive" ]; then
            echo "::error::The retained checksum has an invalid digest or filename."
            exit 1
          fi
          (
            cd "$ROLLBACK_DIR"
            sha256sum --check --strict --status "$expected_checksum"
          )
          unzip -tq "$archive"
          zip_entries="${RUNNER_TEMP}/amplify-rollback-zip-entries.txt"
          zipinfo -1 "$archive" >"$zip_entries"
          if grep -Eq '(^/|(^|/)\.\.(/|$)|\\)' "$zip_entries" ||
            grep -q '^$' "$zip_entries"; then
            echo "::error::The retained Amplify ZIP contains an unsafe path."
            exit 1
          fi
          if [ "$(grep -cx 'release.json' "$zip_entries")" -ne 1 ]; then
            echo "::error::The retained Amplify ZIP must contain exactly one root release.json."
            exit 1
          fi
          unzip -p "$archive" release.json |
            jq -e \
              --arg sha "$PREVIOUS_SHA" \
              'type == "object" and .sha == $sha and (keys | sort) == ["sha"]' \
              >/dev/null
          echo "archive=$archive" >>"$GITHUB_OUTPUT"

      - name: Deploy candidate Amplify branch
        id: candidate_deploy
        run: |
          scripts/deploy/amplify-static-deploy.sh \
            "${{ steps.terraform.outputs.amplify_app_id }}" \
            "${{ steps.terraform.outputs.candidate_branch }}" \
            "$AMPLIFY_ARTIFACT"

      - name: Smoke candidate Amplify frontend and direct API boundary
        env:
          AMPLIFY_DEFAULT_DOMAIN: ${{ steps.terraform.outputs.amplify_default_domain }}
          CANDIDATE_BRANCH: ${{ steps.terraform.outputs.candidate_branch }}
        run: |
          set -euo pipefail
          candidate_url="https://${CANDIDATE_BRANCH}.${AMPLIFY_DEFAULT_DOMAIN}"
          api_url="https://${API_DOMAIN}"
          for path in /; do
            curl \
              --connect-timeout 5 \
              --fail \
              --location \
              --max-time 20 \
              --show-error \
              --retry 20 \
              --retry-all-errors \
              --retry-delay 5 \
              "${candidate_url}${path}" >/dev/null
          done
          candidate_security_headers="${RUNNER_TEMP}/candidate-security.headers"
          curl \
            --connect-timeout 5 \
            --fail \
            --max-time 20 \
            --silent \
            --show-error \
            --retry 20 \
            --retry-all-errors \
            --retry-delay 5 \
            --dump-header "$candidate_security_headers" \
            --output /dev/null \
            "${candidate_url}/"
          if ! grep -Fqi "strict-transport-security: max-age=31536000; includeSubDomains" \
            "$candidate_security_headers" ||
            ! grep -Fqi "x-content-type-options: nosniff" "$candidate_security_headers" ||
            ! grep -Fqi "x-frame-options: DENY" "$candidate_security_headers" ||
            ! grep -Fqi "referrer-policy: no-referrer" "$candidate_security_headers" ||
            ! grep -i '^content-security-policy:' "$candidate_security_headers" |
              grep -Fq "connect-src 'self' https://${API_DOMAIN}"; then
            echo "::error::Candidate Amplify responses do not contain the reviewed security-header policy."
            exit 1
          fi
          while IFS= read -r route; do
            for path in "/${route}" "/${route}/"; do
              curl \
                --connect-timeout 5 \
                --fail \
                --location \
                --max-time 20 \
                --show-error \
                --retry 20 \
                --retry-all-errors \
                --retry-delay 5 \
                "${candidate_url}${path}" >/dev/null
            done
          done < <(jq -r '.static_routes[]' src/frontend/amplify-routes.json)
          while IFS= read -r legacy_route; do
            for path in "/${legacy_route}" "/${legacy_route}/" "/${legacy_route}/legacy"; do
              curl \
                --connect-timeout 5 \
                --fail \
                --location \
                --max-time 20 \
                --show-error \
                --retry 20 \
                --retry-all-errors \
                --retry-delay 5 \
                "${candidate_url}${path}" >/dev/null
            done
          done < <(jq -r '.legacy_redirects | keys[]' src/frontend/amplify-routes.json)

          event_redirect_headers="${RUNNER_TEMP}/candidate-event-redirect.headers"
          event_redirect_status="$(
            curl \
              --connect-timeout 5 \
              --max-time 20 \
              --silent \
              --show-error \
              --dump-header "$event_redirect_headers" \
              --output /dev/null \
              --write-out "%{http_code}" \
              "${candidate_url}/event/?code=AMPLIFYSMOKE"
          )"
          event_redirect_location="$(
            awk '
              BEGIN { IGNORECASE = 1 }
              /^location:/ {
                sub(/^[^:]+:[[:space:]]*/, "")
                sub(/\r$/, "")
                print
              }
            ' "$event_redirect_headers" |
              tail -1
          )"
          if [ "$event_redirect_status" != "301" ]; then
            echo "::error::Candidate trailing-slash route returned ${event_redirect_status}; expected 301."
            exit 1
          fi
          case "$event_redirect_location" in
            "/event?code=AMPLIFYSMOKE" | "${candidate_url}/event?code=AMPLIFYSMOKE") ;;
            *)
              echo "::error::Candidate route redirect did not preserve the query string: ${event_redirect_location:-missing}"
              exit 1
              ;;
          esac

          static_asset="$(
            find src/frontend/out/_next/static -type f -name '*.js' -print -quit |
              sed 's#^src/frontend/out##'
          )"
          if [ -z "$static_asset" ]; then
            echo "::error::The Amplify artifact has no JavaScript asset to smoke-test."
            exit 1
          fi
          curl \
            --connect-timeout 5 \
            --fail \
            --max-time 20 \
            --show-error \
            --retry 20 \
            --retry-all-errors \
            --retry-delay 5 \
            "${candidate_url}${static_asset}" >/dev/null

          release_sha=""
          for attempt in $(seq 1 30); do
            release_sha="$(
              curl \
                --connect-timeout 5 \
                --fail \
                --max-time 20 \
                --silent \
                --show-error \
                "${candidate_url}/release.json" |
                jq -er .sha 2>/dev/null ||
                true
            )"
            if [ "$release_sha" = "$DEPLOY_SHA" ]; then break; fi
            echo "Candidate release identity is converging; attempt=${attempt}/30"
            sleep 5
          done
          if [ "$release_sha" != "$DEPLOY_SHA" ]; then
            echo "::error::Candidate Amplify release is ${release_sha}; expected ${DEPLOY_SHA}."
            exit 1
          fi

          preflight_headers="${RUNNER_TEMP}/candidate-api-preflight.headers"
          preflight_status="$(
            curl \
              --connect-timeout 5 \
              --max-time 20 \
              --silent \
              --show-error \
              --request OPTIONS \
              --header "Origin: ${candidate_url}" \
              --header "Access-Control-Request-Method: PUT" \
              --header "Access-Control-Request-Headers: authorization,content-type" \
              --dump-header "$preflight_headers" \
              --output /dev/null \
              --write-out "%{http_code}" \
              "${api_url}/authn/profile/"
          )"
          if [ "$preflight_status" != "200" ] ||
            ! grep -Fqi "access-control-allow-origin: ${candidate_url}" "$preflight_headers" ||
            ! grep -qiE '^access-control-allow-credentials:[[:space:]]*true' "$preflight_headers"; then
            echo "::error::The API did not accept the candidate frontend credentialed CORS preflight."
            exit 1
          fi

          refresh_headers="${RUNNER_TEMP}/candidate-refresh.headers"
          refresh_status="$(
            curl \
              --connect-timeout 5 \
              --max-time 20 \
              --silent \
              --show-error \
              --request POST \
              --header "Origin: ${candidate_url}" \
              --header "Content-Type: application/json" \
              --data '{}' \
              --dump-header "$refresh_headers" \
              --output /dev/null \
              --write-out "%{http_code}" \
              "${api_url}/authn/refresh/"
          )"
          if [ "$refresh_status" != "401" ]; then
            echo "::error::Direct API refresh returned ${refresh_status}; expected 401."
            exit 1
          fi
          if ! grep -Fqi "access-control-allow-origin: ${candidate_url}" "$refresh_headers" ||
            ! grep -qiE '^access-control-allow-credentials:[[:space:]]*true' "$refresh_headers"; then
            echo "::error::Direct API refresh omitted credentialed CORS response headers."
            exit 1
          fi

          smoke_bearer="api-domain-smoke-invalid"
          for method_and_path in \
            "PUT /authn/profile/" \
            "DELETE /authn/sessions/"; do
            read -r method path <<<"$method_and_path"
            protected_status="$(
              curl \
                --connect-timeout 5 \
                --max-time 20 \
                --silent \
                --show-error \
                --request "$method" \
                --oauth2-bearer "$smoke_bearer" \
                --header "Origin: ${candidate_url}" \
                --header "Content-Type: application/json" \
                --data '{}' \
                --output /dev/null \
                --write-out "%{http_code}" \
                "${api_url}${path}"
            )"
            if [ "$protected_status" != "401" ]; then
              echo "::error::Direct API ${method} ${path} returned ${protected_status}; expected 401."
              exit 1
            fi
          done

          admin_headers="${RUNNER_TEMP}/api-admin.headers"
          admin_body="${RUNNER_TEMP}/api-admin.html"
          admin_cookies="${RUNNER_TEMP}/api-admin.cookies"
          admin_post_body="${RUNNER_TEMP}/api-admin-post.html"
          curl \
            --connect-timeout 5 \
            --fail \
            --max-time 20 \
            --silent \
            --show-error \
            "${api_url}/static/admin/css/base.css" >/dev/null
          curl \
            --connect-timeout 5 \
            --fail \
            --max-time 20 \
            --silent \
            --show-error \
            --cookie-jar "$admin_cookies" \
            --dump-header "$admin_headers" \
            --output "$admin_body" \
            "${api_url}/admin/login/"
          if ! grep -qiE '^set-cookie:[[:space:]]*csrftoken=' "$admin_headers"; then
            echo "::error::The direct Django admin did not issue a CSRF cookie."
            exit 1
          fi
          csrf_token="$(
            sed -n 's/.*name="csrfmiddlewaretoken" value="\([^"]*\)".*/\1/p' "$admin_body" |
              head -1
          )"
          if [ -z "$csrf_token" ]; then
            echo "::error::Candidate admin login did not return a CSRF form token."
            exit 1
          fi
          if ! grep -qi '<form' "$admin_body"; then
            echo "::error::Direct Django admin did not return its login form."
            exit 1
          fi
          admin_post_status="$(
            curl \
              --connect-timeout 5 \
              --max-time 20 \
              --silent \
              --show-error \
              --cookie "$admin_cookies" \
              --request POST \
              --header "Origin: ${api_url}" \
              --header "Referer: ${api_url}/admin/login/" \
              --data-urlencode "csrfmiddlewaretoken=${csrf_token}" \
              --data-urlencode "username=amplify-smoke-${DEPLOY_SHA}@example.invalid" \
              --data-urlencode "email=amplify-smoke-${DEPLOY_SHA}@example.invalid" \
              --data-urlencode "password=amplify-smoke-invalid" \
              --data-urlencode "next=/admin/" \
              --output "$admin_post_body" \
              --write-out "%{http_code}" \
              "${api_url}/admin/login/"
          )"
          if [ "$admin_post_status" != "200" ] && [ "$admin_post_status" != "400" ]; then
            echo "::error::Direct Django admin POST returned ${admin_post_status}; expected a rejected login form."
            exit 1
          fi
          if ! grep -qi '<form' "$admin_post_body" ||
            ! grep -q 'name="csrfmiddlewaretoken"' "$admin_post_body"; then
            echo "::error::Direct Django admin POST did not return the rejected login form."
            exit 1
          fi

      - name: Revalidate Amplify production rollback point
        if: >-
          ${{ steps.domain_state.outputs.preexisting == 'true' &&
              steps.apex_alias.outputs.routes_to_alb != 'true' }}
        env:
          AMPLIFY_APP_ID: ${{ steps.terraform.outputs.amplify_app_id }}
          AMPLIFY_DEFAULT_DOMAIN: ${{ steps.terraform.outputs.amplify_default_domain }}
          PREVIOUS_SHA: ${{ steps.previous_amplify_production.outputs.sha }}
          PRODUCTION_BRANCH: ${{ steps.terraform.outputs.production_branch }}
        run: |
          set -euo pipefail
          production_url="https://${PRODUCTION_BRANCH}.${AMPLIFY_DEFAULT_DOMAIN}"
          current_sha="$(
            curl \
              --connect-timeout 5 \
              --fail \
              --max-time 20 \
              --silent \
              --show-error \
              "${production_url}/release.json" |
              jq -er .sha
          )"
          if [ "$current_sha" != "$PREVIOUS_SHA" ]; then
            echo "::error::Amplify production changed after the rollback artifact was captured; expected ${PREVIOUS_SHA}, found ${current_sha}."
            exit 1
          fi
          active_jobs="$(
            aws amplify list-jobs \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$PRODUCTION_BRANCH" \
              --max-results 50 \
              --output json |
              jq -c '
                [
                  (.jobSummaries // [])[]
                  | select(
                      .status == "CREATED"
                      or .status == "PENDING"
                      or .status == "PROVISIONING"
                      or .status == "RUNNING"
                      or .status == "CANCELLING"
                    )
                  | {jobId, status}
                ]
              '
          )"
          if [ "$(jq 'length' <<<"$active_jobs")" -ne 0 ]; then
            echo "::error::Amplify production gained an active release job after preflight: ${active_jobs}"
            exit 1
          fi

      - name: Require a safe live-branch mutation budget
        env:
          JOB_STARTED_AT: ${{ steps.job_budget.outputs.started_at }}
        run: |
          set -euo pipefail
          now="$(date +%s)"
          elapsed=$((now - JOB_STARTED_AT))
          remaining=$((PRODUCTION_JOB_TIMEOUT_SECONDS - elapsed))
          rollback_reserve=$((90 * 60))
          if [ "$remaining" -lt "$rollback_reserve" ]; then
            echo "::error::Only ${remaining}s remain in the production job; at least ${rollback_reserve}s are required before mutating the live Amplify branch."
            exit 1
          fi
          echo "::notice::Live-branch rollback budget is ${remaining}s."

      - name: Deploy production Amplify branch
        id: production_deploy
        run: |
          scripts/deploy/amplify-static-deploy.sh \
            "${{ steps.terraform.outputs.amplify_app_id }}" \
            "${{ steps.terraform.outputs.production_branch }}" \
            "$AMPLIFY_ARTIFACT"

      - name: Smoke production Amplify branch before domain cutover
        env:
          AMPLIFY_DEFAULT_DOMAIN: ${{ steps.terraform.outputs.amplify_default_domain }}
          PRODUCTION_BRANCH: ${{ steps.terraform.outputs.production_branch }}
        run: |
          set -euo pipefail
          production_url="https://${PRODUCTION_BRANCH}.${AMPLIFY_DEFAULT_DOMAIN}"
          phase_deadline=$((SECONDS + 600))
          bounded_curl() {
            local remaining=$((phase_deadline - SECONDS))
            if [ "$remaining" -le 0 ]; then
              echo "::error::Production Amplify branch smoke exceeded its 600s deadline." >&2
              return 124
            fi
            timeout --signal=TERM "${remaining}s" curl "$@"
          }
          for path in /; do
            bounded_curl \
              --connect-timeout 5 \
              --fail \
              --location \
              --max-time 20 \
              --show-error \
              --retry 20 \
              --retry-all-errors \
              --retry-delay 5 \
              "${production_url}${path}" >/dev/null
          done
          while IFS= read -r route; do
            for path in "/${route}" "/${route}/"; do
              bounded_curl \
                --connect-timeout 5 \
                --fail \
                --location \
                --max-time 20 \
                --show-error \
                --retry 20 \
                --retry-all-errors \
                --retry-delay 5 \
                "${production_url}${path}" >/dev/null
            done
          done < <(jq -r '.static_routes[]' src/frontend/amplify-routes.json)
          static_asset="$(
            find src/frontend/out/_next/static -type f -name '*.js' -print -quit |
              sed 's#^src/frontend/out##'
          )"
          bounded_curl \
            --connect-timeout 5 \
            --fail \
            --max-time 20 \
            --show-error \
            --retry 20 \
            --retry-all-errors \
            --retry-delay 5 \
            "${production_url}${static_asset}" >/dev/null
          release_sha=""
          for attempt in $(seq 1 30); do
            release_sha="$(
              bounded_curl \
                --connect-timeout 5 \
                --fail \
                --max-time 20 \
                --silent \
                --show-error \
                "${production_url}/release.json" |
                jq -er .sha 2>/dev/null ||
                true
            )"
            if ((SECONDS >= phase_deadline)); then
              echo "::error::Production Amplify branch smoke exceeded its 600s deadline."
              exit 1
            fi
            if [ "$release_sha" = "$DEPLOY_SHA" ]; then break; fi
            echo "Production branch release identity is converging; attempt=${attempt}/30"
            sleep 5
          done
          if [ "$release_sha" != "$DEPLOY_SHA" ]; then
            echo "::error::Production Amplify branch is ${release_sha}; expected ${DEPLOY_SHA}."
            exit 1
          fi
          for path in /health/live /health /admin/; do
            bounded_curl \
              --connect-timeout 5 \
              --fail \
              --location \
              --max-time 20 \
              --show-error \
              --retry 20 \
              --retry-all-errors \
              --retry-delay 5 \
              "https://${API_DOMAIN}${path}" >/dev/null
          done
          canonical_preflight_headers="${RUNNER_TEMP}/canonical-api-preflight.headers"
          canonical_preflight_status="$(
            bounded_curl \
              --connect-timeout 5 \
              --max-time 20 \
              --silent \
              --show-error \
              --request OPTIONS \
              --header "Origin: https://${PROD_DOMAIN}" \
              --header "Access-Control-Request-Method: PUT" \
              --header "Access-Control-Request-Headers: authorization,content-type" \
              --dump-header "$canonical_preflight_headers" \
              --output /dev/null \
              --write-out "%{http_code}" \
              "https://${API_DOMAIN}/authn/profile/"
          )"
          if [ "$canonical_preflight_status" != "200" ] ||
            ! grep -Fqi "access-control-allow-origin: https://${PROD_DOMAIN}" \
              "$canonical_preflight_headers" ||
            ! grep -qiE '^access-control-allow-credentials:[[:space:]]*true' \
              "$canonical_preflight_headers"; then
            echo "::error::The API did not accept the canonical frontend credentialed CORS preflight."
            exit 1
          fi

      - name: Verify preserved canonical alias immediately before cutover
        if: ${{ steps.apex_alias.outputs.routes_to_alb == 'true' }}
        env:
          ALIAS_FILE: ${{ steps.apex_alias.outputs.record_file }}
          ROUTE53_ZONE_ID: ${{ vars.PROD_ROUTE53_ZONE_ID }}
        run: |
          set -euo pipefail
          canonical_name="${PROD_DOMAIN%.}."
          current_alias="$(
            aws route53 list-resource-record-sets \
              --hosted-zone-id "$ROUTE53_ZONE_ID" \
              --output json |
              jq \
                --arg name "$canonical_name" \
                '[
                  .ResourceRecordSets[]
                  | select(.Name == $name and .Type == "A")
                ]
                | if length == 1 then .[0] else empty end'
          )"
          if [ "$(jq -S -c . <<<"$current_alias")" != "$(jq -S -c . "$ALIAS_FILE")" ]; then
            echo "::error::The canonical alias changed after it was captured; refusing cutover."
            exit 1
          fi

      - name: Plan reviewed Amplify domain association
        env:
          TF_VAR_enable_amplify_domain: "true"
          TF_VAR_enable_legacy_api_compatibility: ${{ steps.api_transition.outputs.compatibility }}
          TF_VAR_frontend_image_tag: ${{ steps.rollback_frontend.outputs.sha }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/prod plan -input=false -out=production-domain.tfplan
          terraform -chdir=infra/prod show -json production-domain.tfplan |
            jq -e '
              all(
                .resource_changes[]?;
                (.change.actions | index("delete")) == null
              )
            ' >/dev/null

      - name: Require a safe first-cutover time budget
        if: ${{ steps.apex_alias.outputs.routes_to_alb == 'true' }}
        env:
          JOB_STARTED_AT: ${{ steps.job_budget.outputs.started_at }}
        run: |
          set -euo pipefail
          now="$(date +%s)"
          elapsed=$((now - JOB_STARTED_AT))
          remaining=$((PRODUCTION_JOB_TIMEOUT_SECONDS - elapsed))
          compensation_reserve=$((70 * 60))
          if [ "$remaining" -lt "$compensation_reserve" ]; then
            echo "::error::Only ${remaining}s remain in the production job; at least ${compensation_reserve}s are required before the first DNS cutover."
            exit 1
          fi
          echo "::notice::First-cutover safety budget is ${remaining}s."

      - name: Apply exact Amplify domain association plan
        id: domain_apply
        run: terraform -chdir=infra/prod apply -input=false -auto-approve production-domain.tfplan

      - name: Reconcile Amplify domain association for a migration retry
        if: >-
          ${{ steps.domain_state.outputs.preexisting == 'true' &&
              steps.apex_alias.outputs.routes_to_alb == 'true' }}
        env:
          AMPLIFY_APP_ID: ${{ steps.terraform.outputs.amplify_app_id }}
          PRODUCTION_BRANCH: ${{ steps.terraform.outputs.production_branch }}
        run: |
          set -euo pipefail
          subdomains="$(
            jq -nc \
              --arg branch "$PRODUCTION_BRANCH" \
              '[{prefix: "", branchName: $branch}]'
          )"
          aws amplify update-domain-association \
            --app-id "$AMPLIFY_APP_ID" \
            --domain-name "$PROD_DOMAIN" \
            --no-enable-auto-sub-domain \
            --sub-domain-settings "$subdomains" \
            --certificate-settings type=AMPLIFY_MANAGED >/dev/null

      - name: Wait for Amplify custom domain availability
        env:
          AMPLIFY_APP_ID: ${{ steps.terraform.outputs.amplify_app_id }}
          FIRST_CUTOVER: ${{ steps.apex_alias.outputs.routes_to_alb }}
        run: |
          set -euo pipefail
          max_attempts=30
          if [ "$FIRST_CUTOVER" = "true" ]; then
            max_attempts=120
          fi
          for attempt in $(seq 1 "$max_attempts"); do
            association="$(
              aws amplify get-domain-association \
                --app-id "$AMPLIFY_APP_ID" \
                --domain-name "$PROD_DOMAIN" \
                --output json
            )"
            status="$(jq -r '.domainAssociation.domainStatus' <<<"$association")"
            update_status="$(
              jq -r '.domainAssociation.updateStatus // "NONE"' <<<"$association"
            )"
            if [ "$status" = "AVAILABLE" ] &&
              [[ "$update_status" =~ ^(NONE|UPDATE_COMPLETE)$ ]]; then
              exit 0
            fi
            if [ "$status" = "FAILED" ] || [ "$update_status" = "UPDATE_FAILED" ]; then
              echo "::error::Amplify domain association failed; domain=${status}, update=${update_status}."
              exit 1
            fi
            echo "Amplify domain=${status}, update=${update_status}; attempt=${attempt}/${max_attempts}"
            sleep 10
          done
          echo "::error::Timed out waiting for Amplify custom domain."
          exit 1

      - name: Verify Amplify canonical DNS cutover
        id: amplify_alias
        env:
          AMPLIFY_APP_ID: ${{ steps.terraform.outputs.amplify_app_id }}
          FIRST_CUTOVER: ${{ steps.apex_alias.outputs.routes_to_alb }}
          PRODUCTION_BRANCH: ${{ steps.terraform.outputs.production_branch }}
          ROUTE53_ZONE_ID: ${{ vars.PROD_ROUTE53_ZONE_ID }}
        run: |
          set -euo pipefail
          canonical_name="${PROD_DOMAIN%.}."
          amplify_alias_file="${RUNNER_TEMP}/amplify-apex-a-alias.json"
          association="$(
            aws amplify get-domain-association \
              --app-id "$AMPLIFY_APP_ID" \
              --domain-name "$PROD_DOMAIN" \
              --output json
          )"
          expected_amplify_target="$(
            bash scripts/deploy/amplify-apex-target.sh \
              "$PRODUCTION_BRANCH" <<<"$association"
          )"
          if [ -z "$expected_amplify_target" ]; then
            echo "::error::Amplify returned an invalid canonical DNS target."
            exit 1
          fi
          if [ "${{ steps.apex_alias.outputs.routes_to_alb }}" = "true" ] &&
            [ "$expected_amplify_target" = "${{ steps.apex_alias.outputs.pre_release_alias_target }}" ]; then
            echo "::error::Amplify returned the existing ALB as its canonical DNS target."
            exit 1
          fi
          cutover_confirmed=false
          max_attempts=12
          if [ "$FIRST_CUTOVER" = "true" ]; then
            max_attempts=60
          fi
          for attempt in $(seq 1 "$max_attempts"); do
            matches="$(
              aws route53 list-resource-record-sets \
                --hosted-zone-id "$ROUTE53_ZONE_ID" \
                --output json |
                jq \
                  --arg name "$canonical_name" \
                  '[
                    .ResourceRecordSets[]
                    | select(.Name == $name and .Type == "A")
                  ]'
            )"
            alias_target="$(
              jq -r '
                if length == 1
                then .[0].AliasTarget.DNSName // "" | ascii_downcase | rtrimstr(".")
                else ""
                end
              ' <<<"$matches"
            )"
            if [ -n "$alias_target" ] &&
              [ "$alias_target" = "$expected_amplify_target" ]; then
              jq '.[0]' <<<"$matches" >"$amplify_alias_file"
              cutover_confirmed=true
              break
            fi
            echo "Canonical Route53 alias is converging to Amplify; attempt=${attempt}/${max_attempts}"
            sleep 10
          done
          if [ "$cutover_confirmed" != "true" ]; then
            echo "::error::The canonical alias did not match Amplify's exact apex DNS target."
            exit 1
          fi
          echo "record_file=$amplify_alias_file" >>"$GITHUB_OUTPUT"

      - name: Run canonical production smoke tests
        id: canonical_smoke
        run: |
          set -euo pipefail
          phase_deadline=$((SECONDS + 600))
          bounded_curl() {
            local remaining=$((phase_deadline - SECONDS))
            if [ "$remaining" -le 0 ]; then
              echo "::error::Canonical production smoke exceeded its 600s deadline." >&2
              return 124
            fi
            timeout --signal=TERM "${remaining}s" curl "$@"
          }
          bounded_curl \
            --connect-timeout 5 \
            --fail \
            --location \
            --max-time 20 \
            --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 10 \
            "https://${PROD_DOMAIN}/" >/dev/null
          canonical_security_headers="${RUNNER_TEMP}/canonical-security.headers"
          bounded_curl \
            --connect-timeout 5 \
            --fail \
            --max-time 20 \
            --silent \
            --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 10 \
            --dump-header "$canonical_security_headers" \
            --output /dev/null \
            "https://${PROD_DOMAIN}/"
          if ! grep -Fqi "strict-transport-security: max-age=31536000; includeSubDomains" \
            "$canonical_security_headers" ||
            ! grep -Fqi "x-content-type-options: nosniff" "$canonical_security_headers" ||
            ! grep -Fqi "x-frame-options: DENY" "$canonical_security_headers" ||
            ! grep -Fqi "referrer-policy: no-referrer" "$canonical_security_headers" ||
            ! grep -i '^content-security-policy:' "$canonical_security_headers" |
              grep -Fq "connect-src 'self' https://${API_DOMAIN}"; then
            echo "::error::Canonical Amplify responses do not contain the reviewed security-header policy."
            exit 1
          fi
          for path in /health/live /health /admin/; do
            bounded_curl \
              --connect-timeout 5 \
              --fail \
              --location \
              --max-time 20 \
              --show-error \
              --retry 30 \
              --retry-all-errors \
              --retry-delay 10 \
              "https://${API_DOMAIN}${path}" >/dev/null
          done
          canonical_preflight_headers="${RUNNER_TEMP}/canonical-api-preflight.headers"
          canonical_preflight_status="$(
            bounded_curl \
              --connect-timeout 5 \
              --max-time 20 \
              --silent \
              --show-error \
              --request OPTIONS \
              --header "Origin: https://${PROD_DOMAIN}" \
              --header "Access-Control-Request-Method: PUT" \
              --header "Access-Control-Request-Headers: authorization,content-type" \
              --dump-header "$canonical_preflight_headers" \
              --output /dev/null \
              --write-out "%{http_code}" \
              "https://${API_DOMAIN}/authn/profile/"
          )"
          if [ "$canonical_preflight_status" != "200" ] ||
            ! grep -Fqi "access-control-allow-origin: https://${PROD_DOMAIN}" \
              "$canonical_preflight_headers" ||
            ! grep -qiE '^access-control-allow-credentials:[[:space:]]*true' \
              "$canonical_preflight_headers"; then
            echo "::error::The API did not accept the canonical frontend credentialed CORS preflight."
            exit 1
          fi
          release_sha=""
          for attempt in $(seq 1 30); do
            release_sha="$(
              bounded_curl \
                --connect-timeout 5 \
                --fail \
                --max-time 20 \
                --silent \
                --show-error \
                "https://${PROD_DOMAIN}/release.json" |
                jq -er .sha 2>/dev/null ||
                true
            )"
            if ((SECONDS >= phase_deadline)); then
              echo "::error::Canonical production smoke exceeded its 600s deadline."
              exit 1
            fi
            if [ "$release_sha" = "$DEPLOY_SHA" ]; then break; fi
            echo "Canonical release identity is converging; attempt=${attempt}/30"
            sleep 5
          done
          if [ "$release_sha" != "$DEPLOY_SHA" ]; then
            echo "::error::Canonical production release is ${release_sha}; expected ${DEPLOY_SHA}."
            exit 1
          fi

      - name: Plan final production topology
        env:
          TF_VAR_enable_amplify_domain: "true"
          TF_VAR_enable_legacy_api_compatibility: "false"
          TF_VAR_frontend_image_tag: ${{ github.sha }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/prod plan -input=false -out=production-final.tfplan
          final_plan_json="${RUNNER_TEMP}/production-final-plan.json"
          terraform -chdir=infra/prod show -json production-final.tfplan >"$final_plan_json"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          expected_frontend_image="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_FRONTEND}:${DEPLOY_SHA}"
          unexpected_changes="$(
            jq -c \
              --arg api_url "https://${API_DOMAIN}" \
              --arg api_domain "$API_DOMAIN" \
              --arg prod_domain "$PROD_DOMAIN" \
              --arg legacy_origin_domain "$LEGACY_ORIGIN_DOMAIN" \
              --arg legacy_origin_url "https://${LEGACY_ORIGIN_DOMAIN}" \
              --arg frontend_image "$expected_frontend_image" \
              '
              def backend_proxy_source:
                . == "/api"
                or startswith("/api/")
                or . == "/authn"
                or startswith("/authn/")
                or . == "/admin"
                or startswith("/admin/")
                or . == "/static"
                or startswith("/static/");
              def reviewed_backend_rule:
                if .source == "/admin" then
                  .target == "/admin/" and .status == "301"
                else
                  (.target | startswith($legacy_origin_url + "/"))
                  and .status == "200"
                end;
              def prune_unknown:
                if type == "object" then
                  with_entries(.value |= prune_unknown)
                  | with_entries(
                      select(
                        .value != null
                        and .value != false
                        and .value != {}
                        and .value != []
                      )
                    )
                elif type == "array" then
                  map(prune_unknown)
                  | map(
                      select(
                        . != null
                        and . != false
                        and . != {}
                        and . != []
                      )
                    )
                else
                  .
                end;
              def normalized_task:
                del(.arn, .arn_without_revision, .id, .revision)
                | .ipc_mode = (.ipc_mode // "")
                | .pid_mode = (.pid_mode // "")
                | .task_role_arn = (.task_role_arn // "");
              def named_entries_are_unique:
                (map(.name) | length) == (map(.name) | unique | length);
              def normalized_backend_container:
                fromjson
                | .[0].environment |= (
                    map(
                      if .name == "DJANGO_ALLOWED_HOSTS"
                        or .name == "ENABLE_LEGACY_API_PREFIX"
                      then .value = "__REVIEWED_FINAL_TRANSITION__"
                      else .
                      end
                    )
                    | sort_by(.name)
                  )
                | .[0].secrets |= sort_by(.name)
                ;
              def normalized_frontend_container:
                fromjson
                | .[0].image = "__REVIEWED_FINAL_IMAGE__"
                | .[0].environment |= (
                    map(
                        if .name == "BACKEND_URL"
                        then .value = "__REVIEWED_FINAL_TRANSITION__"
                        else .
                        end
                      )
                    | sort_by(.name)
                  )
                ;
              def backend_final_values_are_safe:
                (.change.before.container_definitions | fromjson) as $before_containers
                | (.change.after.container_definitions | fromjson) as $after_containers
                | ($before_containers[0]) as $before_container
                | ($after_containers[0]) as $after_container
                | (
                    $before_container.environment
                    | map({key: .name, value: .value})
                    | from_entries
                  ) as $before_environment
                | (
                    $after_container.environment
                    | map({key: .name, value: .value})
                    | from_entries
                  ) as $after_environment
                | ($before_containers | length) == 1
                and ($after_containers | length) == 1
                and ($before_container.environment | named_entries_are_unique)
                and ($after_container.environment | named_entries_are_unique)
                and ($before_container.secrets | named_entries_are_unique)
                and ($after_container.secrets | named_entries_are_unique)
                and ($after_environment.ENABLE_LEGACY_API_PREFIX == "0")
                and ($after_environment.BACKEND_URL == $api_url)
                and (
                  ($before_environment.DJANGO_ALLOWED_HOSTS | split(",")) as $before_hosts
                  | ($after_environment.DJANGO_ALLOWED_HOSTS | split(",")) as $after_hosts
                  | ($after_hosts | length) == ($after_hosts | unique | length)
                  and all($after_hosts[]; . != "" and . != "*")
                  and (
                    $after_hosts | sort
                  ) == (
                    $before_hosts
                    | map(select(. != $prod_domain and . != $legacy_origin_domain))
                    | sort
                  )
                  and ($after_hosts | index($api_domain)) != null
                );
              def frontend_final_values_are_safe:
                (.change.before.container_definitions | fromjson) as $before_containers
                | (.change.after.container_definitions | fromjson) as $after_containers
                | ($after_containers[0]) as $container
                | (
                    $container.environment
                    | map({key: .name, value: .value})
                    | from_entries
                  ) as $environment
                | ($before_containers | length) == 1
                and ($after_containers | length) == 1
                and ($before_containers[0].environment | named_entries_are_unique)
                and ($after_containers[0].environment | named_entries_are_unique)
                and ($container.image == $frontend_image)
                and ($environment.BACKEND_URL == $api_url);
              [
                .resource_changes[]?
                | select(.change.actions != ["no-op"])
                | .address as $address
                | .change.actions as $actions
                | select(
                    if $address == "aws_amplify_app.frontend" then
                      $actions != ["update"]
                      or (
                        (.change.before | del(.custom_rule))
                        != (.change.after | del(.custom_rule))
                      )
                      or (
                        [
                          .change.before.custom_rule[]
                          | select(.source | backend_proxy_source | not)
                        ]
                        | sort_by(.source, .target, .status)
                      ) != (
                        [
                          .change.after.custom_rule[]
                          | select(.source | backend_proxy_source | not)
                        ]
                        | sort_by(.source, .target, .status)
                      )
                      or (
                        [
                          .change.before.custom_rule[]
                          | select(.source | backend_proxy_source)
                        ] as $retired_rules
                        | ($retired_rules | length) == 0
                        or any($retired_rules[]; reviewed_backend_rule | not)
                      )
                      or any(
                        .change.after.custom_rule[];
                        .source | backend_proxy_source
                      )
                      or ((.change.after_unknown | prune_unknown) != {})
                    elif $address == "aws_cloudwatch_event_target.event_reminders" then
                      $actions != ["update"]
                      or (
                        (.change.before | del(.ecs_target[0].task_definition_arn))
                        != (.change.after | del(.ecs_target[0].task_definition_arn))
                      )
                      or (
                        (
                          .change.after_unknown
                          | del(.ecs_target[0].task_definition_arn)
                          | prune_unknown
                        ) != {}
                      )
                    elif $address == "aws_ecs_service.backend"
                      or $address == "aws_ecs_service.frontend" then
                      $actions != ["update"]
                      or (
                        (.change.before | del(.task_definition))
                        != (.change.after | del(.task_definition))
                      )
                      or (
                        (
                          .change.after_unknown
                          | del(.task_definition)
                          | prune_unknown
                        ) != {}
                      )
                    elif $address == "aws_lb_target_group.backend" then
                      $actions != ["update"]
                      or (
                        (.change.before | del(.health_check[0].path))
                        != (.change.after | del(.health_check[0].path))
                      )
                      or (.change.before.health_check[0].path != "/api/health")
                      or (.change.after.health_check[0].path != "/health")
                      or ((.change.after_unknown | prune_unknown) != {})
                    elif $address == "aws_ecs_task_definition.backend" then
                      ($actions | sort) != ["create", "delete"]
                      or (
                        (
                          .change.before
                          | normalized_task
                          | .container_definitions |= normalized_backend_container
                        )
                        != (
                          .change.after
                          | normalized_task
                          | .container_definitions |= normalized_backend_container
                        )
                      )
                      or (backend_final_values_are_safe | not)
                      or (
                        (
                          .change.after_unknown
                          | del(.arn, .arn_without_revision, .id, .revision)
                          | prune_unknown
                        ) != {}
                      )
                    elif $address == "aws_ecs_task_definition.frontend" then
                      ($actions | sort) != ["create", "delete"]
                      or (
                        (
                          .change.before
                          | normalized_task
                          | .container_definitions |= normalized_frontend_container
                        )
                        != (
                          .change.after
                          | normalized_task
                          | .container_definitions |= normalized_frontend_container
                        )
                      )
                      or (frontend_final_values_are_safe | not)
                      or (
                        (
                          .change.after_unknown
                          | del(.arn, .arn_without_revision, .id, .revision)
                          | prune_unknown
                        ) != {}
                      )
                    elif (
                      [
                        "aws_acm_certificate.origin[0]",
                        "aws_acm_certificate_validation.origin[0]",
                        "aws_lb_listener_certificate.origin[0]",
                        "aws_lb_listener_rule.backend[0]",
                        "aws_route53_record.origin[0]"
                      ]
                      | index($address)
                    ) != null
                    or ($address | startswith("aws_route53_record.origin_cert_validation[")) then
                      $actions != ["delete"]
                    else
                      true
                    end
                  )
                | {address, actions: .change.actions}
              ]
              ' "$final_plan_json"
          )"
          if [ "$unexpected_changes" != "[]" ]; then
            task_definition_diagnostics="$(
              jq -c '
                def prune_unknown:
                  if type == "object" then
                    with_entries(.value |= prune_unknown)
                    | with_entries(
                        select(
                          .value != null
                          and .value != false
                          and .value != {}
                          and .value != []
                        )
                      )
                  elif type == "array" then
                    map(prune_unknown)
                    | map(
                        select(
                          . != null
                          and . != false
                          and . != {}
                          and . != []
                        )
                      )
                  else
                    .
                  end;
                [
                  .resource_changes[]?
                  | select(
                      .address == "aws_ecs_task_definition.backend"
                      or .address == "aws_ecs_task_definition.frontend"
                    )
                  | (.change.before.container_definitions | fromjson) as $before
                  | (.change.after.container_definitions | fromjson) as $after
                  | {
                      address,
                      actions: .change.actions,
                      before_environment_order: [$before[0].environment[]?.name],
                      after_environment_order: [$after[0].environment[]?.name],
                      before_secret_order: [$before[0].secrets[]?.name],
                      after_secret_order: [$after[0].secrets[]?.name],
                      before_optional_task_strings: {
                        ipc_mode: .change.before.ipc_mode,
                        pid_mode: .change.before.pid_mode,
                        task_role_arn: .change.before.task_role_arn
                      },
                      after_optional_task_strings: {
                        ipc_mode: .change.after.ipc_mode,
                        pid_mode: .change.after.pid_mode,
                        task_role_arn: .change.after.task_role_arn
                      },
                      remaining_after_unknown: (
                        .change.after_unknown
                        | del(.arn, .arn_without_revision, .id, .revision)
                        | prune_unknown
                      )
                    }
                ]
              ' "$final_plan_json"
            )"
            echo "::error::Task-definition comparison diagnostics: ${task_definition_diagnostics}"
            echo "::error::Final topology plan contains changes outside the reviewed allowlist: ${unexpected_changes}"
            exit 1
          fi

      - name: Apply exact final production topology plan
        id: final_topology
        run: terraform -chdir=infra/prod apply -input=false -auto-approve production-final.tfplan

      - name: Verify final API-only backend topology
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          expected_backend_image="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_BACKEND}:${DEPLOY_SHA}"
          expected_frontend_image="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_FRONTEND}:${DEPLOY_SHA}"
          legacy_state="$(
            terraform -chdir=infra/prod state list |
              grep -E \
                '^aws_(acm_certificate|acm_certificate_validation|lb_listener_certificate)\.origin(\[0\])?$|^aws_lb_listener_rule\.backend(\[0\])?$|^aws_route53_record\.origin(\[0\])?$|^aws_route53_record\.origin_cert_validation\[' ||
              true
          )"
          if [ -n "$legacy_state" ]; then
            echo "::error::Legacy API compatibility resources remain in Terraform state."
            printf '%s\n' "$legacy_state" >&2
            exit 1
          fi
          aws ecs wait services-stable \
            --cluster "${{ steps.terraform.outputs.cluster_name }}" \
            --services \
              "${{ steps.terraform.outputs.backend_service }}" \
              "${{ steps.terraform.outputs.frontend_service }}"
          for service in \
            "${{ steps.terraform.outputs.backend_service }}" \
            "${{ steps.terraform.outputs.frontend_service }}"; do
            target_group="$(
              aws ecs describe-services \
                --cluster "${{ steps.terraform.outputs.cluster_name }}" \
                --services "$service" \
                --query "services[0].loadBalancers[0].targetGroupArn" \
                --output text
            )"
            health="$(aws elbv2 describe-target-health --target-group-arn "$target_group")"
            if ! jq -e '
              [.TargetHealthDescriptions[].TargetHealth.State] as $states
              | ($states | length) > 0
              and all($states[]; . == "healthy")
            ' <<<"$health" >/dev/null; then
              echo "::error::Final ECS target health is not fully healthy for ${service}."
              jq -r '.TargetHealthDescriptions[].TargetHealth.State' <<<"$health"
              exit 1
            fi
          done
          backend_task_definition="$(
            aws ecs describe-services \
              --cluster "${{ steps.terraform.outputs.cluster_name }}" \
              --services "${{ steps.terraform.outputs.backend_service }}" \
              --query "services[0].taskDefinition" \
              --output text
          )"
          expected_backend_task_definition="$(
            terraform -chdir=infra/prod output -raw backend_task_definition_arn
          )"
          if [ "$backend_task_definition" != "$expected_backend_task_definition" ]; then
            echo "::error::The backend service is not running the final Terraform task definition."
            exit 1
          fi
          backend_image="$(
            aws ecs describe-task-definition \
              --task-definition "$backend_task_definition" \
              --query "taskDefinition.containerDefinitions[0].image" \
              --output text
          )"
          if [ "$backend_image" != "$expected_backend_image" ]; then
            echo "::error::The final ECS backend is not the selected release: ${backend_image}"
            exit 1
          fi
          frontend_task_definition="$(
            aws ecs describe-services \
              --cluster "${{ steps.terraform.outputs.cluster_name }}" \
              --services "${{ steps.terraform.outputs.frontend_service }}" \
              --query "services[0].taskDefinition" \
              --output text
          )"
          expected_frontend_task_definition="$(
            terraform -chdir=infra/prod output -raw frontend_task_definition_arn
          )"
          if [ "$frontend_task_definition" != "$expected_frontend_task_definition" ]; then
            echo "::error::The frontend fallback service is not running the final Terraform task definition."
            exit 1
          fi
          frontend_image="$(
            aws ecs describe-task-definition \
              --task-definition "$frontend_task_definition" \
              --query "taskDefinition.containerDefinitions[0].image" \
              --output text
          )"
          if [ "$frontend_image" != "$expected_frontend_image" ]; then
            echo "::error::The final ECS frontend fallback is not the selected release: ${frontend_image}"
            exit 1
          fi
          event_targets="$(
            aws events list-targets-by-rule \
              --rule "${{ steps.terraform.outputs.event_reminders_rule }}" \
              --output json
          )"
          if ! jq -e \
            --arg expected "$expected_backend_task_definition" \
            '(.Targets | length) == 1
              and .Targets[0].EcsParameters.TaskDefinitionArn == $expected' \
              <<<"$event_targets" >/dev/null; then
            echo "::error::The reminder rule must have exactly one target pinned to the final backend task definition."
            exit 1
          fi
          for path in /health/live /health /admin/; do
            curl \
              --connect-timeout 5 \
              --fail \
              --location \
              --max-time 20 \
              --show-error \
              --retry 20 \
              --retry-all-errors \
              --retry-delay 5 \
              "https://${API_DOMAIN}${path}" >/dev/null
          done
          curl \
            --connect-timeout 5 \
            --fail \
            --max-time 20 \
            --show-error \
            --retry 20 \
            --retry-all-errors \
            --retry-delay 5 \
            "https://${API_DOMAIN}/static/admin/css/base.css" >/dev/null
          final_preflight_headers="${RUNNER_TEMP}/final-api-preflight.headers"
          final_preflight_status="$(
            curl \
              --connect-timeout 5 \
              --max-time 20 \
              --silent \
              --show-error \
              --request OPTIONS \
              --header "Origin: https://${PROD_DOMAIN}" \
              --header "Access-Control-Request-Method: PUT" \
              --header "Access-Control-Request-Headers: authorization,content-type" \
              --dump-header "$final_preflight_headers" \
              --output /dev/null \
              --write-out "%{http_code}" \
              "https://${API_DOMAIN}/authn/profile/"
          )"
          if [ "$final_preflight_status" != "200" ] ||
            ! grep -Fqi "access-control-allow-origin: https://${PROD_DOMAIN}" \
              "$final_preflight_headers" ||
            ! grep -qiE '^access-control-allow-credentials:[[:space:]]*true' \
              "$final_preflight_headers"; then
            echo "::error::The final API topology rejected the canonical credentialed CORS preflight."
            exit 1
          fi
          legacy_urls=(
            "https://${PROD_DOMAIN}/api/health"
            "https://${PROD_DOMAIN}/admin/"
            "https://${PROD_DOMAIN}/authn/public-key/"
            "https://${PROD_DOMAIN}/static/admin/css/base.css"
            "https://${API_DOMAIN}/api/health"
          )
          stable_retired_cycles=0
          for attempt in $(seq 1 30); do
            all_retired=true
            for legacy_url in "${legacy_urls[@]}"; do
              probe_result="$(
                curl \
                  --connect-timeout 5 \
                  --header "Cache-Control: no-cache" \
                  --header "Pragma: no-cache" \
                  --location \
                  --max-time 20 \
                  --max-redirs 5 \
                  --silent \
                  --show-error \
                  --output /dev/null \
                  --write-out $'%{http_code}\t%{url_effective}' \
                  "${legacy_url}?retired_check=${DEPLOY_SHA}-${attempt}" ||
                  true
              )"
              status="${probe_result%%$'\t'*}"
              effective_url="${probe_result#*$'\t'}"
              if [ "$effective_url" = "$probe_result" ]; then
                effective_url=""
              fi
              if [[ "$legacy_url" == "https://${PROD_DOMAIN}/"* ]]; then
                expected_origin="https://${PROD_DOMAIN}/"
              elif [[ "$legacy_url" == "https://${API_DOMAIN}/"* ]]; then
                expected_origin="https://${API_DOMAIN}/"
              else
                expected_origin=""
              fi
              if [ "$status" != "404" ] ||
                [ -z "$expected_origin" ] ||
                [[ "$effective_url" != "${expected_origin}"* ]]; then
                all_retired=false
                echo "Retired URL is still converging; url=${legacy_url}, status=${status:-request-failed}, effective_url=${effective_url:-request-failed}, attempt=${attempt}/30"
              fi
            done
            if [ "$all_retired" = "true" ]; then
              stable_retired_cycles=$((stable_retired_cycles + 1))
              if [ "$stable_retired_cycles" -ge 3 ]; then
                break
              fi
            else
              stable_retired_cycles=0
            fi
            sleep 5
          done
          if [ "$stable_retired_cycles" -lt 3 ]; then
            echo "::error::Retired frontend proxy and API-prefix URLs did not stabilize at 404."
            exit 1
          fi

      - name: Restore pre-release canonical Route53 alias after failed first cutover
        id: restore_apex_alias
        if: >-
          ${{ always() &&
              (failure() || cancelled()) &&
              steps.apex_alias.outputs.routes_to_alb == 'true' &&
              steps.canonical_smoke.outcome != 'success' &&
              (steps.domain_apply.outcome == 'success' ||
               steps.domain_apply.outcome == 'failure' ||
               steps.domain_apply.outcome == 'cancelled') }}
        env:
          ALIAS_FILE: ${{ steps.apex_alias.outputs.record_file }}
          AMPLIFY_ALIAS_FILE: ${{ steps.amplify_alias.outputs.record_file }}
          AMPLIFY_APP_ID: ${{ steps.terraform.outputs.amplify_app_id }}
          PRODUCTION_BRANCH: ${{ steps.terraform.outputs.production_branch }}
          ROUTE53_ZONE_ID: ${{ vars.PROD_ROUTE53_ZONE_ID }}
        run: |
          set -euo pipefail
          canonical_name="${PROD_DOMAIN%.}."
          if ! jq -e \
            --arg name "$canonical_name" \
            '
              .Name == $name
              and .Type == "A"
              and (.AliasTarget | type == "object")
              and (.AliasTarget.DNSName | type == "string" and length > 0)
            ' "$ALIAS_FILE" >/dev/null; then
            echo "::error::The captured canonical alias is missing or invalid."
            exit 1
          fi
          association_file="${RUNNER_TEMP}/failed-cutover-domain-association.json"
          association_error="${RUNNER_TEMP}/failed-cutover-domain-association.error"
          association_terminal=false
          for attempt in $(seq 1 120); do
            if aws amplify get-domain-association \
              --app-id "$AMPLIFY_APP_ID" \
              --domain-name "$PROD_DOMAIN" \
              --output json >"$association_file" 2>"$association_error"; then
              domain_status="$(jq -r '.domainAssociation.domainStatus // "UNKNOWN"' "$association_file")"
              update_status="$(jq -r '.domainAssociation.updateStatus // "NONE"' "$association_file")"
              if { [ "$domain_status" = "AVAILABLE" ] &&
                [[ "$update_status" =~ ^(NONE|UPDATE_COMPLETE)$ ]]; } ||
                [ "$update_status" = "UPDATE_FAILED" ] ||
                { [ "$domain_status" = "FAILED" ] && [ "$update_status" = "NONE" ]; }; then
                association_terminal=true
                break
              fi
              echo "Waiting for the failed cutover's Amplify domain writer to stop; domain=${domain_status}, update=${update_status}, attempt=${attempt}/120"
            elif grep -q 'NotFoundException' "$association_error"; then
              : >"$association_file"
              association_terminal=true
              break
            else
              echo "Unable to read Amplify domain status while compensating; attempt=${attempt}/120"
              cat "$association_error" >&2
            fi
            sleep 10
          done
          if [ "$association_terminal" != "true" ]; then
            echo "::error::Amplify domain activity did not reach a terminal state; refusing to claim DNS compensation succeeded."
            exit 1
          fi

          expected_alias="$(jq -S -c . "$ALIAS_FILE")"
          recognized_amplify_alias_json=""
          amplify_target=""
          if [ -n "$AMPLIFY_ALIAS_FILE" ] && [ -s "$AMPLIFY_ALIAS_FILE" ]; then
            recognized_amplify_alias_json="$(jq -S -c . "$AMPLIFY_ALIAS_FILE")"
          elif [ -s "$association_file" ]; then
            amplify_target="$(
              bash scripts/deploy/amplify-apex-target.sh \
                "$PRODUCTION_BRANCH" <"$association_file"
            )"
          fi

          change_batch="${RUNNER_TEMP}/restore-pre-release-apex-alias.json"
          jq -n \
            --arg comment "Restore exact pre-Amplify canonical alias after failed release ${DEPLOY_SHA}" \
            --slurpfile record "$ALIAS_FILE" \
            '{
              Comment: $comment,
              Changes: [
                {
                  Action: "UPSERT",
                  ResourceRecordSet: $record[0]
                }
              ]
            }' >"$change_batch"

          read_canonical_alias() {
            aws route53 list-resource-record-sets \
              --hosted-zone-id "$ROUTE53_ZONE_ID" \
              --output json |
              jq -S -c \
                --arg name "$canonical_name" \
                '[
                  .ResourceRecordSets[]
                  | select(.Name == $name and .Type == "A")
                ]
                | if length == 1 then .[0] else empty end'
          }

          is_recognized_amplify_alias() {
            local candidate_alias="$1"
            if [ -n "$recognized_amplify_alias_json" ] &&
              [ "$candidate_alias" = "$recognized_amplify_alias_json" ]; then
              return 0
            fi
            local candidate_target
            candidate_target="$(
              jq -r '.AliasTarget.DNSName // "" | ascii_downcase | rtrimstr(".")' \
                <<<"$candidate_alias"
            )"
            [ -n "$amplify_target" ] && [ "$candidate_target" = "$amplify_target" ]
          }

          restore_canonical_alias() {
            last_change_id="$(
              aws route53 change-resource-record-sets \
                --hosted-zone-id "$ROUTE53_ZONE_ID" \
                --change-batch "file://${change_batch}" \
                --query "ChangeInfo.Id" \
                --output text
            )"
            aws route53 wait resource-record-sets-changed --id "$last_change_id"
          }

          actual_alias="$(read_canonical_alias)"
          if [ "$actual_alias" != "$expected_alias" ]; then
            if ! is_recognized_amplify_alias "$actual_alias"; then
              echo "::error::The canonical alias changed to an unrecognized target; refusing to overwrite it."
              exit 1
            fi
            restore_canonical_alias
          else
            last_change_id="already-restored"
          fi

          stable_alias_checks=0
          for attempt in $(seq 1 12); do
            actual_alias="$(read_canonical_alias)"
            if [ "$actual_alias" = "$expected_alias" ]; then
              stable_alias_checks=$((stable_alias_checks + 1))
              if [ "$stable_alias_checks" -ge 6 ]; then
                break
              fi
            elif is_recognized_amplify_alias "$actual_alias"; then
              echo "::warning::Amplify rewrote the canonical alias after compensation; restoring it again."
              restore_canonical_alias
              stable_alias_checks=0
            else
              echo "::error::The canonical alias changed to an unrecognized target during the compensation stability window."
              exit 1
            fi
            sleep 10
          done
          if [ "$stable_alias_checks" -lt 6 ]; then
            echo "::error::The restored canonical alias did not remain stable."
            exit 1
          fi
          echo "::notice::Restored and stabilized the exact pre-release ALB alias; last change=${last_change_id}."

      - name: Roll back production Amplify branch after failed release
        if: >-
          ${{ always() &&
              (failure() || cancelled()) &&
              steps.apex_alias.outputs.routes_to_alb != 'true' &&
              steps.domain_state.outputs.preexisting == 'true' &&
              steps.canonical_smoke.outcome != 'success' &&
              steps.previous_amplify_production.outcome == 'success' &&
              steps.verify_previous_amplify_artifact.outcome == 'success' &&
              steps.production_deploy.outputs.terminal_confirmed == 'true' &&
              steps.production_deploy.outcome != 'skipped' }}
        env:
          API_COMPATIBILITY: ${{ steps.api_transition.outputs.compatibility }}
          AMPLIFY_DEFAULT_DOMAIN: ${{ steps.terraform.outputs.amplify_default_domain }}
          AMPLIFY_APP_ID: ${{ steps.terraform.outputs.amplify_app_id }}
          PREVIOUS_SHA: ${{ steps.previous_amplify_production.outputs.sha }}
          PRODUCTION_BRANCH: ${{ steps.terraform.outputs.production_branch }}
          ROLLBACK_ARCHIVE: ${{ steps.verify_previous_amplify_artifact.outputs.archive }}
        run: |
          set -euo pipefail
          if ! [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            [ ! -f "$ROLLBACK_ARCHIVE" ]; then
            echo "::error::A valid Amplify rollback point was not captured."
            exit 1
          fi
          scripts/deploy/amplify-static-deploy.sh \
            "$AMPLIFY_APP_ID" \
            "$PRODUCTION_BRANCH" \
            "$ROLLBACK_ARCHIVE"
          production_url="https://${PRODUCTION_BRANCH}.${AMPLIFY_DEFAULT_DOMAIN}"
          phase_deadline=$((SECONDS + 300))
          bounded_curl() {
            local remaining=$((phase_deadline - SECONDS))
            if [ "$remaining" -le 0 ]; then
              echo "::error::Amplify rollback smoke exceeded its 300s deadline." >&2
              return 124
            fi
            timeout --signal=TERM "${remaining}s" curl "$@"
          }
          for base_url in "$production_url" "https://${PROD_DOMAIN}"; do
            bounded_curl \
              --connect-timeout 5 \
              --fail \
              --location \
              --max-time 20 \
              --show-error \
              --retry 10 \
              --retry-all-errors \
              --retry-delay 3 \
              "${base_url}/" >/dev/null
            if [ "$API_COMPATIBILITY" = "true" ]; then
              for path in /api/health/live /api/health /admin/; do
                bounded_curl \
                  --connect-timeout 5 \
                  --fail \
                  --location \
                  --max-time 20 \
                  --show-error \
                  --retry 10 \
                  --retry-all-errors \
                  --retry-delay 3 \
                  "${base_url}${path}" >/dev/null
              done
            else
              for path in /api/health /admin/; do
                status="$(
                  bounded_curl \
                    --connect-timeout 5 \
                    --max-time 20 \
                    --silent \
                    --show-error \
                    --output /dev/null \
                    --write-out "%{http_code}" \
                    "${base_url}${path}"
                )"
                if [ "$status" != "404" ]; then
                  echo "::error::Retired frontend backend URL ${base_url}${path} returned ${status}; expected 404."
                  exit 1
                fi
              done
            fi
          done
          for path in /health/live /health /admin/ /static/admin/css/base.css; do
            bounded_curl \
              --connect-timeout 5 \
              --fail \
              --location \
              --max-time 20 \
              --show-error \
              --retry 10 \
              --retry-all-errors \
              --retry-delay 3 \
              "https://${API_DOMAIN}${path}" >/dev/null
          done
          for base_url in "$production_url" "https://${PROD_DOMAIN}"; do
            release_sha=""
            for attempt in $(seq 1 30); do
              release_sha="$(
                bounded_curl \
                  --connect-timeout 5 \
                  --fail \
                  --max-time 20 \
                  --silent \
                  --show-error \
                  "${base_url}/release.json" |
                  jq -er .sha 2>/dev/null ||
                  true
              )"
              if ((SECONDS >= phase_deadline)); then
                echo "::error::Amplify rollback smoke exceeded its 300s deadline."
                exit 1
              fi
              if [ "$release_sha" = "$PREVIOUS_SHA" ]; then break; fi
              echo "Amplify rollback identity is converging at ${base_url}; attempt=${attempt}/30"
              sleep 5
            done
            if [ "$release_sha" != "$PREVIOUS_SHA" ]; then
              echo "::error::Amplify rollback at ${base_url} is ${release_sha}; expected ${PREVIOUS_SHA}."
              exit 1
            fi
          done
          echo "::notice::Restored Amplify production to retained artifact ${PREVIOUS_SHA}."

      - name: Summarize immutable production release
        if: ${{ always() }}
        run: |
          {
            echo "## Production release"
            echo
            echo "- Git SHA: \`${DEPLOY_SHA}\`"
            echo "- Amplify app: \`${{ steps.terraform.outputs.amplify_app_id }}\`"
            echo "- Candidate job: \`${{ steps.candidate_deploy.outputs.job_id }}\`"
            echo "- Production job: \`${{ steps.production_deploy.outputs.job_id }}\`"
            echo "- Pre-release ECS frontend fallback SHA: \`${{ steps.rollback_frontend.outputs.sha }}\`"
            echo "- Final ECS frontend fallback update: \`${{ steps.final_topology.outcome }}\`"
            echo "- Domain-association orphan recovered: \`${{ steps.domain_state.outputs.recovered_orphan }}\`"
            echo "- Pre-release canonical alias targeted ALB: \`${{ steps.apex_alias.outputs.routes_to_alb }}\`"
            echo "- First-cutover DNS compensation: \`${{ steps.restore_apex_alias.outcome }}\`"
          } >>"$GITHUB_STEP_SUMMARY"
