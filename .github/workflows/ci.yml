  e2e-plan:
    name: Plan E2E Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Capture changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            : > changed-files.txt
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            : > changed-files.txt
            exit 0
          fi
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt
          cat changed-files.txt

      - name: Select browser and spec coverage
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/ci/plan_e2e_tests.py \
            --event-name "$EVENT_NAME" \
            --changed-files changed-files.txt \
            >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    needs:
      - e2e-plan
      - frontend-required
      - secrets-scan
      - changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.e2e-plan.outputs.matrix) }}
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_DB: releviz_test
          POSTGRES_USER: releviz
          POSTGRES_PASSWORD: releviz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U releviz -d releviz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: releviz_test
      DB_USER: releviz
      DB_PASSWORD: releviz
      DB_TEST_NAME: releviz_test
      BACKEND_URL: http://127.0.0.1:4100
      FRONTEND_URL: http://127.0.0.1:3100
      EMAIL_FILE_PATH: /tmp/releviz-e2e-mail
      DJANGO_SUPERUSER_EMAIL: admin@releviz.local
      DJANGO_SUPERUSER_PASSWORD: Admin12345!
      PW_PROJECT: ${{ matrix.project }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/local.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements/local.txt

      - name: Install frontend dependencies
        run: npm ci --workspace=frontend

      - name: Download CI frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-next-ci
          path: frontend/.next

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-cfw

      - name: Install Playwright browsers on cache miss
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies on cache hit
        if: ${{ steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: npx playwright install-deps chromium firefox webkit

      - name: Prepare backend database and email sink
        run: |
          rm -rf "$EMAIL_FILE_PATH"
          mkdir -p "$EMAIL_FILE_PATH"
          python backend/src/manage.py migrate --noinput --settings=config.settings.e2e
          python backend/src/manage.py ensure_default_admin --yes --settings=config.settings.e2e

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_SPEC_ARGS: ${{ matrix.spec_args }}
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
        run: |
          args=()
          if [ -n "$PLAYWRIGHT_SPEC_ARGS" ]; then
            read -r -a args <<< "$PLAYWRIGHT_SPEC_ARGS"
          fi
          npx playwright test \
            --config=e2e/playwright.config.js \
            "${args[@]}" \
            --project="$PW_PROJECT" \
            --reporter=blob

      - name: Upload Playwright blob report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-${{ matrix.project }}
          path: blob-report
          if-no-files-found: warn

      - name: Upload E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-${{ matrix.project }}
          path: |
            test-results
            e2e/test-results
          if-no-files-found: ignore

  e2e-report:
    name: E2E Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [e2e, changes]
    if: ${{ always() && needs.changes.outputs.e2e == 'true' }}
    continue-on-error: true
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --workspace=frontend

      - name: Download blob reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-*
          merge-multiple: true

      - name: Merge blob reports
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results.xml
        run: |
          set -euo pipefail
          if [ ! -d all-blob-reports ] || [ -z "$(ls -A all-blob-reports 2>/dev/null)" ]; then
            echo "::notice::No blob reports to merge."
            exit 0
          fi
          npx playwright merge-reports --reporter html,github,junit all-blob-reports

      - name: Write E2E summary
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          total = fail = err = skip = 0
          duration = 0.0
          for filename in sorted(glob.glob("results*.xml")):
              try:
                  root = ET.parse(filename).getroot()
              except Exception:
                  continue
              suites = [root] if root.tag == "testsuite" else root.iter("testsuite")
              for suite in suites:
                  total += int(suite.get("tests", 0))
                  fail += int(suite.get("failures", 0))
                  err += int(suite.get("errors", 0))
                  skip += int(suite.get("skipped", 0))
                  duration += float(suite.get("time", 0) or 0)
          passed = total - fail - err - skip
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## Playwright E2E\n\n")
                  fh.write("| Total | Passed | Failed | Skipped | Duration |\n")
                  fh.write("|---:|---:|---:|---:|---:|\n")
                  fh.write(f"| {total} | {passed} | {fail + err} | {skip} | {duration:.1f}s |\n")
          PY

      - name: Annotate test results
        if: ${{ always() }}
        continue-on-error: true
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: results.xml
          detailed_summary: true
          include_passed: false
          fail_on_failure: false

      - name: Upload merged E2E report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-report
          path: |
            playwright-report
            results.xml
          if-no-files-found: warn

  e2e-informational-result:
    name: E2E Informational Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [e2e-report, changes]
    if: ${{ always() && needs.changes.outputs.e2e == 'true' }}
    continue-on-error: true
    steps:
      - name: Summarize informational E2E checks
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_CONTEXT"])
          for name, data in needs.items():
              if name != "changes":
                  print(f"{name}: {data['result']}")
          print("E2E is informational and does not block CI Result.")
          PY

