  backend-docker-build:
    name: Backend Docker Build and Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-lint, changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build backend image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: backend
          load: true
          tags: releviz-backend-ci:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Cache Trivy vulnerability database
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-backend-${{ github.run_id }}
          restore-keys: trivy-backend-

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        with:
          image-ref: releviz-backend-ci:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload backend Trivy SARIF artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-backend-sarif
          path: trivy-backend.sarif
          if-no-files-found: warn

      - name: Publish backend findings to GitHub Security
        if: ${{ github.event_name == 'push' && !cancelled() }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend-image

