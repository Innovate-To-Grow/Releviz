name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - "infra/**"
      - "scripts/**"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
      - "docker-compose.e2e.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - "infra/**"
      - "scripts/**"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
      - "docker-compose.e2e.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  TERRAFORM_VERSION: "1.15.8"
  COVERAGE_VERSION: "7.15.2"
  BACKEND_COVERAGE_FAIL_UNDER: "100"
  APP_COVERAGE_FAIL_UNDER: "95"
  PIP_AUDIT_VERSION: "2.10.1"
  SEMGREP_VERSION: "1.107.0"
  ACTIONLINT_VERSION: "1.7.7"
  ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements/*.txt
            .pre-commit-config.yaml

      - name: Install preflight tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "pre-commit==4.0.1" "PyYAML==6.0.2"
          curl -sSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint

      - name: Validate workflow syntax
        run: actionlint

      - name: Validate YAML, TOML, and JSON
        run: |
          pre-commit run check-yaml --all-files --show-diff-on-failure
          pre-commit run check-toml --all-files --show-diff-on-failure
          pre-commit run check-json --all-files --show-diff-on-failure

      - name: Validate tool version pins
        run: python scripts/ci/validate_tool_versions.py

      - name: Validate CI helper scripts
        run: python -m unittest discover -s scripts/ci/tests

      - name: Validate Dependabot labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/validate_dependabot_labels.py

  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed areas from the diff
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "Push/non-PR event (${EVENT_NAME}); running the full suite."
            {
              echo "backend=true"
              echo "frontend=true"
              echo "e2e=true"
              echo "infra=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable PR base SHA; running the full suite."
            {
              echo "backend=true"
              echo "frontend=true"
              echo "e2e=true"
              echo "infra=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          echo "Changed files:"
          echo "$files"
          match() { grep -qE "$1" <<< "$files"; }

          backend=false
          frontend=false
          e2e=false
          infra=false
          if match '^(backend/|scripts/|\.github/|\.pre-commit-config\.yaml|package(-lock)?\.json|docker-compose\.e2e\.yml)'; then backend=true; fi
          if match '^(frontend/|e2e/|scripts/|\.github/|\.pre-commit-config\.yaml|package(-lock)?\.json|docker-compose\.e2e\.yml)'; then frontend=true; fi
          if match '^(frontend/|e2e/|scripts/|\.github/|package(-lock)?\.json|docker-compose\.e2e\.yml)'; then e2e=true; fi
          if match '^(infra/|scripts/terraform-check\.sh|\.github/|\.pre-commit-config\.yaml)'; then infra=true; fi
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "e2e=$e2e"
            echo "infra=$infra"
          } >> "$GITHUB_OUTPUT"

  backend-lint:
    name: Backend Lint and Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [preflight, changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/local.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements/local.txt

      - name: Check Python formatting
        run: ruff format --check backend/src scripts/ci

      - name: Run Python lint
        run: ruff check backend/src scripts/ci

  backend-full-coverage:
    name: Backend - Lint & Test (100% Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-lint, changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/local.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements/local.txt "coverage[toml]==${COVERAGE_VERSION}"

      - name: Run complete Django suite with strict coverage
        run: |
          coverage run src/manage.py test --settings=config.settings.test
          coverage xml -o coverage.xml
          coverage json --pretty-print -o coverage.json
          coverage report -m --fail-under="${BACKEND_COVERAGE_FAIL_UNDER}"

      - name: Summarize backend coverage
        if: ${{ always() }}
        run: |
          if [ ! -f coverage.json ]; then
            echo "::warning::Backend coverage summary was not generated."
            exit 0
          fi
          python - <<'PY'
          import json
          import os

          with open("coverage.json", encoding="utf-8") as fh:
              totals = json.load(fh)["totals"]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## Backend aggregate coverage\n\n")
                  fh.write("| Metric | Covered | Total | Percent |\n")
                  fh.write("|---|---:|---:|---:|\n")
                  fh.write(
                      f"| Lines | {totals['covered_lines']} | {totals['num_statements']} | "
                      f"{totals['percent_covered_display']}% |\n"
                  )
          PY

      - name: Check Django configuration
        run: python src/manage.py check --settings=config.settings.test

      - name: Upload backend aggregate coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/coverage.json
          if-no-files-found: warn

  backend-db-migration:
    name: Backend DB Migration Test (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-lint, changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_DB: releviz_test
          POSTGRES_USER: releviz
          POSTGRES_PASSWORD: releviz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U releviz -d releviz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: releviz_test
      DB_USER: releviz
      DB_PASSWORD: releviz
      DB_TEST_NAME: test_releviz
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/local.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements/local.txt

      - name: Check migration files are current
        run: python src/manage.py makemigrations --check --dry-run --settings=config.settings.test_postgres

      - name: Apply migrations on PostgreSQL
        run: python src/manage.py migrate --noinput --settings=config.settings.test_postgres

      - name: Ensure no pending migrations remain
        run: python src/manage.py migrate --check --settings=config.settings.test_postgres

  backend-static-and-prod-check:
    name: Backend Static and Production Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-lint, changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-production-smoke-secret-key-with-enough-entropy-for-deploy-checks-2026
      DJANGO_FIELD_ENCRYPTION_KEY: ci-field-encryption-key-with-enough-entropy-2026
      METRICS_BEARER_TOKEN: ci-metrics-token-with-enough-entropy-2026
      DJANGO_ALLOWED_HOSTS: api.example.com
      BACKEND_URL: https://api.example.com
      FRONTEND_URL: https://app.example.com
      DB_NAME: releviz_ci
      DB_USER: releviz_ci
      DB_PASSWORD: releviz_ci_password
      DB_HOST: db.example.com
      DB_PORT: 5432
      DB_SSLMODE: require
      CORS_ALLOWED_ORIGINS: https://app.example.com
      CSRF_TRUSTED_ORIGINS: https://app.example.com
      USE_SES_EMAIL_PROVIDER: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/local.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements/local.txt

      - name: Import production settings
        run: DJANGO_SETTINGS_MODULE=config.settings.production python -c "import sys; sys.path.insert(0, 'src'); import django; django.setup()"

      - name: Run Django deploy checks
        run: python src/manage.py check --deploy --settings=config.settings.production

      - name: Dry-run collectstatic with CI settings
        run: python src/manage.py collectstatic --dry-run --noinput --settings=config.settings.test

  django-test-plan:
    name: Plan Django Test Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Capture changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            : > changed-files.txt
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            : > changed-files.txt
            exit 0
          fi
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt
          cat changed-files.txt

      - name: Select changed Django apps
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/ci/plan_django_tests.py \
            --event-name "$EVENT_NAME" \
            --changed-files changed-files.txt \
            >> "$GITHUB_OUTPUT"

  django-app-coverage:
    name: Django PostgreSQL Coverage (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend-db-migration
      - backend-static-and-prod-check
      - django-test-plan
      - changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.django-test-plan.outputs.apps) }}
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_DB: releviz_test
          POSTGRES_USER: releviz
          POSTGRES_PASSWORD: releviz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U releviz -d releviz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: releviz_test
      DB_USER: releviz
      DB_PASSWORD: releviz
      DB_TEST_NAME: test_releviz
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/local.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements/local.txt "coverage[toml]==${COVERAGE_VERSION}"

      - name: Run app tests against PostgreSQL
        env:
          APP_UNDER_TEST: ${{ matrix.app }}
        run: |
          coverage run \
            --source="apps.${APP_UNDER_TEST}" \
            --omit="*/migrations/*,*/tests/*" \
            src/manage.py test "apps.${APP_UNDER_TEST}" \
            --settings=config.settings.test_postgres
          coverage xml --fail-under=0 -o "coverage-${APP_UNDER_TEST}.xml"
          coverage json --fail-under=0 --pretty-print -o "coverage-${APP_UNDER_TEST}.json"
          coverage report -m --fail-under="${APP_COVERAGE_FAIL_UNDER}"

      - name: Summarize app coverage
        if: ${{ always() }}
        env:
          APP_UNDER_TEST: ${{ matrix.app }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          app = os.environ["APP_UNDER_TEST"]
          path = Path(f"coverage-{app}.json")
          if not path.exists():
              print(f"::warning::Coverage summary for {app} was not generated.")
              raise SystemExit(0)
          totals = json.loads(path.read_text(encoding="utf-8"))["totals"]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(f"## Django PostgreSQL coverage: {app}\n\n")
                  fh.write("| Metric | Covered | Total | Percent |\n")
                  fh.write("|---|---:|---:|---:|\n")
                  fh.write(
                      f"| Lines | {totals['covered_lines']} | {totals['num_statements']} | "
                      f"{totals['percent_covered_display']}% |\n"
                  )
          PY

      - name: Upload app coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-${{ matrix.app }}
          path: |
            backend/coverage-${{ matrix.app }}.xml
            backend/coverage-${{ matrix.app }}.json
          if-no-files-found: warn

  frontend-lint:
    name: Frontend Lint and Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --workspace=frontend

      - name: Check frontend formatting
        run: npm --workspace=frontend run format:check

      - name: Run ESLint
        run: npm --workspace=frontend run lint

  frontend-unit-coverage:
    name: Frontend Unit Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [preflight, changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --workspace=frontend

      - name: Run frontend tests with coverage
        run: npm --workspace=frontend run test:coverage -- --runInBand
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Summarize frontend coverage
        if: ${{ always() }}
        run: |
          if [ ! -f frontend/coverage/coverage-summary.json ]; then
            echo "::warning::Frontend coverage summary was not generated."
            exit 0
          fi
          node - <<'NODE'
          const fs = require("node:fs");
          const summary = JSON.parse(
            fs.readFileSync("frontend/coverage/coverage-summary.json", "utf8"),
          ).total;
          const rows = [
            ["Statements", summary.statements],
            ["Branches", summary.branches],
            ["Functions", summary.functions],
            ["Lines", summary.lines],
          ];
          const target = process.env.GITHUB_STEP_SUMMARY;
          if (target) {
            const body = [
              "## Frontend coverage",
              "",
              "| Metric | Covered | Total | Percent |",
              "|---|---:|---:|---:|",
              ...rows.map(([name, metric]) =>
                `| ${name} | ${metric.covered} | ${metric.total} | ${metric.pct}% |`,
              ),
              "",
            ].join("\n");
            fs.appendFileSync(target, body);
          }
          NODE

      - name: Upload frontend coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn

  frontend-build:
    name: Frontend CI Build Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [preflight, changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --workspace=frontend

      - name: Build frontend for CI and E2E
        run: npm --workspace=frontend run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ""
          BACKEND_URL: http://127.0.0.1:4100

      - name: Upload frontend build
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-next-ci
          path: |
            frontend/.next
            !frontend/.next/cache
            !frontend/.next/standalone
          include-hidden-files: true
          if-no-files-found: warn

  frontend-bundle-size:
    name: Frontend Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [frontend-build, changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download CI frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-next-ci
          path: frontend/.next

      - name: Enforce frontend bundle budgets
        run: python3 scripts/ci/check_bundle_size.py frontend/.next/static

  frontend-security-audit:
    name: Frontend npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --workspace=frontend

      - name: Audit npm dependencies
        run: npm audit --audit-level=low

  frontend-supply-chain-report:
    name: Frontend SBOM and License Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate npm SBOM
        run: npm sbom --sbom-format cyclonedx --json > npm-sbom.cdx.json

      - name: Check npm licenses
        run: python3 scripts/ci/check_npm_licenses.py --package-lock package-lock.json --output npm-license-report.json

      - name: Upload frontend supply-chain artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-supply-chain-reports
          path: |
            npm-sbom.cdx.json
            npm-license-report.json
          if-no-files-found: warn

  frontend-required:
    name: Frontend Required Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - frontend-lint
      - frontend-unit-coverage
      - frontend-build
      - frontend-bundle-size
      - frontend-security-audit
      - frontend-supply-chain-report
      - changes
    if: ${{ always() && needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Summarize frontend required checks
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_CONTEXT"])
          failed = {
              name: data["result"]
              for name, data in needs.items()
              if name != "changes" and data["result"] != "success"
          }
          if failed:
              for name, result in failed.items():
                  print(f"{name}: {result}")
              sys.exit(1)
          print("All frontend required checks passed.")
          PY

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict -
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks

      - name: Scan the PR or push commit range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${PR_HEAD_SHA:-}" ]; then
            RANGE="${BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${PUSH_BEFORE}..${PUSH_HEAD}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            RANGE="HEAD^..HEAD"
          else
            RANGE="HEAD"
          fi
          echo "Scanning commit range: $RANGE"
          /tmp/gitleaks/gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --no-banner \
            --log-opts "$RANGE" \
            --exit-code 1

  python-security-audit:
    name: Python Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/production.txt

      - name: Install pip-audit
        run: pip install "pip-audit[cyclonedx]==${PIP_AUDIT_VERSION}"

      - name: Audit Python dependencies
        run: |
          set -o pipefail
          python -m pip_audit \
            --requirement backend/requirements/production.txt \
            --progress-spinner off \
            --format columns \
            | tee "$GITHUB_STEP_SUMMARY"

  semgrep-sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [preflight, changes]
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Semgrep
        # Semgrep 1.107 imports pkg_resources; keep setuptools below the
        # release that removes that compatibility module.
        run: pip install "setuptools<81" "semgrep==${SEMGREP_VERSION}"

      - name: Run Semgrep
        env:
          RUN_BACKEND: ${{ needs.changes.outputs.backend }}
          RUN_FRONTEND: ${{ needs.changes.outputs.frontend }}
        run: |
          set -euo pipefail
          targets=()
          if [ "$RUN_BACKEND" = "true" ]; then targets+=(backend); fi
          if [ "$RUN_FRONTEND" = "true" ]; then targets+=(frontend); fi
          semgrep scan \
            --config p/default \
            --config p/python \
            --config p/javascript \
            --metrics=off \
            --sarif \
            --output semgrep.sarif \
            "${targets[@]}"

      - name: Upload Semgrep SARIF
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn

