name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-coverage:
    name: Backend - Lint & Test (100% Coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements/local.txt
      - run: python -m pip install -r backend/requirements/local.txt
      - run: ruff format --check backend/src
      - run: ruff check backend/src
      - run: npm --workspace=backend run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov
          if-no-files-found: ignore

  frontend-lint-coverage-build:
    name: Frontend - Lint, Core-Inclusive Coverage & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci --workspace=frontend
      - run: npm --workspace=frontend run format:check
      - run: npm --workspace=frontend run lint
      - run: npm --workspace=frontend run test:coverage -- --runInBand
      - run: npm --workspace=frontend run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements/production.txt
      - run: npm ci --workspace=frontend
      - run: npm audit --audit-level=low
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r backend/requirements/production.txt

  infrastructure-plan:
    name: Terraform - Format, Validate & Mock Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - run: scripts/terraform-check.sh

  postgres-integration:
    name: Postgres Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: releviz_test
          POSTGRES_USER: releviz
          POSTGRES_PASSWORD: releviz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U releviz -d releviz_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: releviz_test
      DB_USER: releviz
      DB_PASSWORD: releviz
      DB_TEST_NAME: test_releviz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements/local.txt
      - run: python -m pip install -r backend/requirements/local.txt
      - run: npm --workspace=backend run test:db

  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: releviz_test
          POSTGRES_USER: releviz
          POSTGRES_PASSWORD: releviz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U releviz -d releviz_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      E2E_SKIP_DOCKER: "1"
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: releviz_test
      DB_USER: releviz
      DB_PASSWORD: releviz
      DB_TEST_NAME: releviz_test
      BACKEND_URL: http://127.0.0.1:4100
      FRONTEND_URL: http://127.0.0.1:3100
      EMAIL_FILE_PATH: /tmp/releviz-e2e-mail
      DJANGO_SUPERUSER_EMAIL: admin@releviz.local
      DJANGO_SUPERUSER_PASSWORD: Admin12345!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements/local.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: python -m pip install -r backend/requirements/local.txt
      - run: npm ci --workspace=frontend
      - run: npm exec --workspace=frontend -- playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  resource-audit:
    name: Repository Resource Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm run test:audit

  docker-build-check:
    name: Docker Build - ${{ matrix.service }}
    needs:
      - backend-lint-coverage
      - frontend-lint-coverage-build
      - postgres-integration
      - playwright-e2e
      - resource-audit
      - dependency-security
      - infrastructure-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: false
          tags: scheduler-${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
