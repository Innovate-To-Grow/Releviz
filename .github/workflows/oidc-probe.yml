name: OIDC subject probe
on:
  pull_request:
    paths: [".github/workflows/oidc-probe.yml"]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    name: Print the OIDC subject claim (repository casing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const payload = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString("utf8"));
            core.info(`sub=${payload.sub}`);
            core.info(`repository=${payload.repository}`);
            core.info(`environment=${payload.environment}`);
            core.info(`aud=${payload.aud}`);
