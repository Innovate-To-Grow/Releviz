services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: releviz_test
      POSTGRES_USER: releviz
      POSTGRES_PASSWORD: releviz
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releviz -d releviz_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
