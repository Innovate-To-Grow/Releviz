[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"src/**/migrations/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
source = ["src/apps", "src/config"]
omit = [
    "src/apps/**/migrations/*",
    "src/apps/**/tests/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
